    if (snap.window) renderWindow(snap.window);
    else if (currentWindowId !== null) closeWindow(currentWindowId);
    // Same reconnect gap as the focused window above, for background panels
    // (todo_write's Todos box, the memory toast): a tab that connects after
    // one already opened needs the snapshot to carry it, not just future
    // window_open/window_update frames. The snapshot is authoritative full
    // state, so drop any card the fresh list no longer names before adding
    // the current ones.
    const livePanelIds = new Set((snap.panels || []).map((w) => w.id));
    for (const id of Array.from(panelCards.keys())) {
      if (!livePanelIds.has(id)) removePanel(id);
    }
    for (const w of snap.panels || []) renderPanel(w);
    if (Array.isArray(snap.queue) && snap.queue.length) {
      log.appendChild(el("msg system", `— ${snap.queue.length} queued prompt(s)`));
    }
    // A fresh snapshot (first load or reconnect) always starts pinned to the
    // bottom, same as opening the page; only later live updates respect scroll.
    pinned = true;
    scrollDown();
  };

  const setStatus = (status) => {
    statusEl.dataset.status = status;
    statusEl.textContent = status;
    stopBtn.style.display = status === "working" ? "inline-block" : "none";
    // Showing/hiding the stop button changes where the floating elements
    // above the composer have to sit.
    syncComposerHeight();
  };

  const connect = () => {
    const es = new EventSource("events");
    es.onopen = () => { connEl.dataset.conn = "live"; connEl.textContent = "live"; };
    es.onerror = () => {
      connEl.dataset.conn = "down";
      connEl.textContent = "reconnecting";
      es.close();
      // Reconnect with a short delay. On a phone whose screen slept, the
      // socket is gone but the page is still open; re-fetching the snapshot
      // on reconnect restores the chat without a hard refresh.
      setTimeout(() => { connect(); refreshSnapshot(); }, 2000);
    };
    for (const kind of ["snapshot", "event", "status", "permission", "permission_resolved", "window_open", "window_update", "window_close"]) {
      es.addEventListener(kind, (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (kind === "snapshot") renderSnapshot(data);
          else if (kind === "event") renderEvent(data);
          else if (kind === "status") setStatus(data);
          else if (kind === "permission") renderEvent({ type: "permission_request", ...data });
          else if (kind === "permission_resolved") renderEvent({ type: "permission_resolved", ...data });
          else if (kind === "window_open" || kind === "window_update") renderWindow(data);
          else if (kind === "window_close") closeWindow(data.id);
        } catch {}
      });
    }
  };

  // Re-fetch the current snapshot so a reconnect (e.g. after the phone screen
  // slept) restores the full chat without a hard refresh.
  const refreshSnapshot = async () => {
    const snap = await fetchJson("snapshot");
    if (snap) renderSnapshot(snap);
  };

  const submit = async (path, body, quiet) => {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok && !quiet) {
        try { const j = await res.json(); if (j.error) toast(j.error); } catch {}
      }
      return res.ok;
    } catch { return false; }
  };

  const fetchJson = async (path) => {
    try { const r = await fetch(path); if (!r.ok) return null; return await r.json(); } catch { return null; }
  };

  const postJson = async (path, body) => {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return await r.json().catch(() => (r.ok ? {} : { error: "failed" }));
    } catch { return { error: "network" }; }
  };

  // ---- window bridge --------------------------------------------------
  // A plugin's maki.ui.open_win() float — /tasks, /sessions, /memory, the
  // question tool's form, anything else built on that primitive — mirrored
  // here as a generic modal. Input always targets whichever window is
  // focused server-side, same as a local keypress, so there is no explicit
  // window id to send on the way out; window_open/window_update/window_close
  // all carry the window's own id, so a stale frame for a window this tab
  // already replaced can be told apart from the current one.
  const winBackdrop = document.getElementById("win-backdrop");
  const winTitleText = document.getElementById("win-title-text");
  const winBody = document.getElementById("win-body");
  const winFooter = document.getElementById("win-footer");
  const winCloseBtn = document.getElementById("win-close");
  let currentWindowId = null;

  // Background panels (todo_write's Todos box, the memory toast, ...) never
  // take focus, so unlike the modal above they render as non-blocking cards
  // stacked over the transcript instead — see renderWindow's `!w.focus`
  // branch. Keyed by window id since more than one can be open at once
  // (open() never evicts same-direction Panel windows the way it does the
  // single-slot splits, e.g. the file panel).
  const panelsEl = document.getElementById("panels");
  const panelCards = new Map();
  const renderPanel = (w) => {
    if (w.visible === false) { removePanel(w.id); return; }
    let card = panelCards.get(w.id);
    if (!card) {
      card = document.createElement("div");
      card.className = "panel-card";
      card.innerHTML =
        '<div class="panel-card-head"><span class="panel-card-title"></span>' +
        '<button class="mini" title="Collapse/expand">▾</button></div>' +
        '<div class="panel-card-body"></div><div class="panel-card-foot"></div>';
      card.querySelector("button").onclick = () => card.classList.toggle("collapsed");
      panelsEl.appendChild(card);
      panelCards.set(w.id, card);
    }
    card.querySelector(".panel-card-title").textContent = (w.title || "").trim();
    card.querySelector(".panel-card-body").innerHTML = w.html || "";
    const foot = card.querySelector(".panel-card-foot");
    foot.innerHTML = "";
    for (const [key, label] of w.footer || []) {
      const span = document.createElement("span");
      span.textContent = `${key} ${label}`;
      foot.appendChild(span);
    }
  };
  const removePanel = (id) => {
    const card = panelCards.get(id);
    if (!card) return;
    card.remove();
    panelCards.delete(id);
  };

  // Each keystroke is its own POST; firing them all concurrently (the
  // ordinary fire-and-forget `submit`) lets a slower request land after a
  // later one and reorder fast typing at the server. Chaining onto one
  // promise makes every request wait for the last to finish before it
  // starts, so keys always arrive in the order they were typed.
  let winInputChain = Promise.resolve();
  const submitWindowInput = (body) => {
    // quiet: true — a key can legitimately race a window closing (Enter on
    // a picker row closes it server-side right as the keystroke lands), and
    // that is not a fault worth a toast.
    winInputChain = winInputChain.then(() => submit("window/input", body, true));
    return winInputChain;
  };
  const submitWindowKey = (key) => submitWindowInput({ key });
  const submitWindowPaste = (text) => submitWindowInput({ paste: text });

  // A window that actually holds local focus is shown as the blocking
  // modal below. A background one (todo_write's panel, the memory plugin's
  // toast, both opened with focus = false) is real window state a browser
  // tab still hears about, but nothing local is dismissing it by hand
  // either, and forward_key_str only ever reaches the focused window — a
  // modal for an unfocused one would have no way to close short of a page
  // reload. It renders as a non-blocking panel card instead (renderPanel).
  const renderWindow = (w) => {
    if (!w.focus) {
      // A window that just lost focus (e.g. a second one opened over it)
      // must not leave its own now-stale modal on screen.
      if (currentWindowId === w.id) closeWindow(w.id);
      renderPanel(w);
      return;
    }
    // The reverse transition (a panel promoted to focus) shouldn't happen
    // in practice, but drop any stale card so the two views never show the
    // same window twice.
    removePanel(w.id);
    currentWindowId = w.id;
    winTitleText.textContent = (w.title || "").trim();
    winBody.innerHTML = w.html || "";
    winFooter.innerHTML = "";
    for (const [key, label] of w.footer || []) {
      const span = document.createElement("span");
      span.textContent = `${key} ${label}`;
      winFooter.appendChild(span);
    }
    const visible = w.visible !== false;
    winBackdrop.hidden = !visible;
    if (visible) {
      winBody.focus();
      // innerHTML above reset scrollTop to 0; without this, arrow-key
      // navigation past the visible area leaves the selection off-screen
      // with nothing on screen ever following it.
      winBody.querySelector(".win-cursor")?.scrollIntoView({ block: "nearest" });
    }
  };

  const closeWindow = (id) => {
    // A close event's id could name either the focused modal or a
    // background panel card — try both rather than requiring the caller to
    // know which kind it was.
    removePanel(id);
    if (currentWindowId !== id) return;
    currentWindowId = null;
    winBackdrop.hidden = true;
  };

  // Esc is the universal float dismissal everywhere in this app (local
  // keybinding, permission card, ...); reusing it here means "close" needs
  // no separate server-side concept — the plugin's own esc handling, which
  // already runs locally, decides what closing means.
  winCloseBtn.onclick = () => submitWindowKey("esc");
  winBackdrop.addEventListener("click", (ev) => {
    if (ev.target === winBackdrop) submitWindowKey("esc");
  });

  // Mirrors maki-ui's key_event_to_string exactly (components/keybindings.rs)
  // so a browser keypress reaches the same WinEvent::Key a local one would.
  const winKeyString = (ev) => {
    let prefix = "";
    if (ev.ctrlKey) prefix += "ctrl+";
    if (ev.altKey) prefix += "alt+";
    const isChar = ev.key.length === 1 && ev.key !== " ";
    if (ev.shiftKey && !isChar) prefix += "shift+";
    switch (ev.key) {
      case " ": return prefix + "space";
      case "Enter": return prefix + "enter";
      case "Escape": return prefix + "esc";
      case "Tab": return prefix + "tab";
      case "Backspace": return prefix + "backspace";
      case "Delete": return prefix + "delete";
      case "ArrowUp": return prefix + "up";
      case "ArrowDown": return prefix + "down";
      case "ArrowLeft": return prefix + "left";
      case "ArrowRight": return prefix + "right";
      case "Home": return prefix + "home";
      case "End": return prefix + "end";
      case "PageUp": return prefix + "pageup";
      case "PageDown": return prefix + "pagedown";
      case "Insert": return prefix + "insert";
      default:
        if (/^F([1-9]|1[0-9]|2[0-4])$/.test(ev.key)) return prefix + ev.key.toLowerCase();
        return isChar ? prefix + ev.key : "";
    }
  };

  winBody.addEventListener("keydown", (ev) => {
    const key = winKeyString(ev);
    if (!key) return;
    ev.preventDefault();
    submitWindowKey(key);
  });
  winBody.addEventListener("paste", (ev) => {
    const text = ev.clipboardData?.getData("text");
    if (text) {
      ev.preventDefault();
      submitWindowPaste(text);
    }
  });

  // ---- file panel ---------------------------------------------------------
  // Slides out from the left: a gitignore-aware tree (server-side, jailed to
  // the session's cwd), a viewer/editor per file (markdown renders through
  // the same renderer the transcript uses), and a diff view against HEAD.
  // Reading needs only the link's own rights; saving is a plain POST, so a
  // view-only link gets the same 403-and-toast every other write does.
  const filesBtn = document.getElementById("files-btn");
  const filesBackdrop = document.getElementById("files-backdrop");
  const filesPanel = document.getElementById("files-panel");
  const filesTree = document.getElementById("files-tree");
  const filesSearchRow = document.getElementById("files-search-row");
  const filesView = document.getElementById("files-view");
  const filesViewBody = document.getElementById("files-view-body");
  const filesViewPath = document.getElementById("files-view-path");
  const filesBranchEl = document.getElementById("files-branch");
  const filesSaveBtn = document.getElementById("files-save");
  const filesDiffBtn = document.getElementById("files-toggle-diff");
  const filesBackBtn = document.getElementById("files-back");
  const filesResize = document.getElementById("files-resize");

  try {
    const savedWidth = localStorage.getItem("maki_files_width");
    if (savedWidth) filesPanel.style.width = savedWidth + "px";
  } catch {}
  (() => {
    let startX = 0;
    let startWidth = 0;
    const onMove = (ev) => {
      const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const w = Math.min(window.innerWidth * 0.92, Math.max(260, startWidth + (x - startX)));
      filesPanel.style.width = w + "px";
    };
    const onUp = () => {
      filesPanel.classList.remove("resizing");
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      try { localStorage.setItem("maki_files_width", String(filesPanel.getBoundingClientRect().width)); } catch {}
    };
    filesResize.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      startX = ev.clientX;
      startWidth = filesPanel.getBoundingClientRect().width;
      filesPanel.classList.add("resizing");
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  })();

  let filesOpen = false;
  let currentFile = null; // { path, content, binary, tooLarge, editing }
  let showingDiff = false;
  // The fuzzy finder's flat file list, fetched once and reused across
  // keystrokes; invalidated on refresh and on any create/rename/delete.
  let filesFlatCache = null;

  const isMarkdownPath = (p) => /\.(md|markdown)$/i.test(p);

  // Every inline editor (new file/dir, rename) shares one "only one open at
  // a time" slot instead of a native prompt()/confirm() — those block the
  // whole tab until dismissed, which is worse on a phone and, not
  // incidentally, doesn't play well with anything scripting this page.
  let activeInlineCancel = null;
  const cancelActiveInline = () => {
    if (activeInlineCancel) {
      const fn = activeInlineCancel;
      activeInlineCancel = null;
      fn();
    }
  };

  const filesInlineCreate = (isDir) => {
    cancelActiveInline();
    const row = document.createElement("div");
    row.className = "files-row files-inline";
    row.innerHTML = `<span class="files-icon">${isDir ? "▸" : "·"}</span>`;
    const input = document.createElement("input");
    input.className = "files-inline-input";
    input.placeholder = isDir ? "new-folder/name" : "new-file.ext";
    row.appendChild(input);
    filesTree.prepend(row);
    input.focus();
    let done = false;
    const cancel = () => { if (done) return; done = true; row.remove(); };
    activeInlineCancel = cancel;
    input.onkeydown = async (ev) => {
      if (ev.key === "Escape") { cancel(); return; }
      if (ev.key !== "Enter") return;
      const path = input.value.trim();
      if (!path) return;
      input.disabled = true;
      const r = await postJson("file/create", { path, is_dir: isDir });
      if (r && r.error) { toast(r.error); input.disabled = false; return; }
      toast("created");
      filesFlatCache = null;
      done = true;
      activeInlineCancel = null;
      row.remove();
      delete filesTree.dataset.loaded;
      loadFilesTree();
      if (!isDir) openFile(r.path);
    };
    input.onblur = () => setTimeout(cancel, 150);
  };
  document.getElementById("files-new-file").onclick = () => filesInlineCreate(false);
  document.getElementById("files-new-dir").onclick = () => filesInlineCreate(true);

  const filesSearchEl = document.getElementById("files-search");
  const renderFlatMatches = (paths) => {
    filesTree.innerHTML = "";
    if (!paths.length) {
      filesTree.innerHTML = `<div class="files-empty">no matches</div>`;
      return;
    }
    for (const p of paths.slice(0, 200)) {
      const row = document.createElement("div");
      row.className = "files-row";
      row.innerHTML = `<span class="files-icon">·</span><span class="files-name">${escHtml(p)}</span>`;
      row.onclick = () => openFile(p);
      filesTree.appendChild(row);
    }
  };
  filesSearchEl.oninput = async () => {
    const q = filesSearchEl.value.trim().toLowerCase();
    if (!q) {
      delete filesTree.dataset.loaded;
      loadFilesTree();
      return;
    }
    if (!filesFlatCache) {
      const data = await fetchJson("files/flat");
      filesFlatCache = (data && data.paths) || [];
    }
    renderFlatMatches(filesFlatCache.filter((p) => p.toLowerCase().includes(q)));
  };

  const openFilesPanel = () => {
    filesOpen = true;
    filesPanel.classList.add("open");
    filesPanel.setAttribute("aria-hidden", "false");
    filesBackdrop.hidden = false;
    if (!filesTree.dataset.loaded) loadFilesTree();
    fetchJson("git/status").then((status) => {
      filesBranchEl.textContent = status && status.is_repo && status.branch ? `⎇ ${status.branch}` : "";
    });
  };
  const closeFilesPanel = () => {
    filesOpen = false;
    filesPanel.classList.remove("open");
    filesPanel.setAttribute("aria-hidden", "true");
    filesBackdrop.hidden = true;
  };
  filesBtn.onclick = () => (filesOpen ? closeFilesPanel() : openFilesPanel());
  document.getElementById("files-close").onclick = closeFilesPanel;
  filesBackdrop.onclick = closeFilesPanel;

  const gitBadge = (code) => code
    ? `<span class="files-git" data-code="${escHtml(code)}">${escHtml(code)}</span>`
    : "";

  // Each row is built fresh per directory fetch; a directory's `<div>` of
  // children is lazy — nothing under it loads until it's actually expanded.
  // Rename edits the row's own name in place; delete arms on a first click
  // and only acts on a second one (auto-disarming after a few seconds),
  // rather than a confirm() dialog. Both refresh just the row's own
  // container afterward, not the whole tree.
  const filesRenameOrDelete = (entry, fullPath, parentPath, container, nameEl) => {
    const renameBtn = document.createElement("button");
    renameBtn.className = "mini";
    renameBtn.textContent = "✎";
    renameBtn.title = "Rename";
    renameBtn.onclick = (ev) => {
      ev.stopPropagation();
      cancelActiveInline();
      const original = nameEl.textContent;
      const input = document.createElement("input");
      input.className = "files-inline-input";
      input.value = original;
      nameEl.replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const cancel = () => {
        if (done) return;
        done = true;
        input.replaceWith(nameEl);
      };
      activeInlineCancel = cancel;
      input.onkeydown = async (kev) => {
        if (kev.key === "Escape") { cancel(); return; }
        if (kev.key !== "Enter") return;
        const next = input.value.trim();
        if (!next || next === original) { cancel(); return; }
        const to = parentPath ? `${parentPath}/${next}` : next;
        input.disabled = true;
        const r = await postJson("file/rename", { from: fullPath, to });
        if (r && r.error) { toast(r.error); input.disabled = false; return; }
        toast("renamed");
        filesFlatCache = null;
        done = true;
        activeInlineCancel = null;
        loadFilesInto(container, parentPath);
      };
      input.onblur = () => setTimeout(cancel, 150);
    };
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "mini";
    deleteBtn.title = entry.is_dir ? "Delete (must be empty)" : "Delete";
    deleteBtn.textContent = "🗑";
    let armed = false;
    let armTimer = null;
    deleteBtn.onclick = (ev) => {
      ev.stopPropagation();
      if (!armed) {
        armed = true;
        deleteBtn.textContent = "sure?";
        deleteBtn.classList.add("danger");
        armTimer = setTimeout(() => {
          armed = false;
          deleteBtn.textContent = "🗑";
          deleteBtn.classList.remove("danger");
        }, 3000);
        return;
      }
      clearTimeout(armTimer);
      postJson("file/delete", { path: fullPath }).then((r) => {
        if (r && r.error) {
          toast(r.error);
          armed = false;
          deleteBtn.textContent = "🗑";
          deleteBtn.classList.remove("danger");
          return;
        }
        toast("deleted");
        filesFlatCache = null;
        loadFilesInto(container, parentPath);
      });
    };
    const actions = document.createElement("span");
    actions.className = "files-actions";
    actions.append(renameBtn, deleteBtn);
    return actions;
  };

  const filesRow = (entry, parentPath, container) => {
    const row = document.createElement("div");
    row.className = "files-row";
    row.setAttribute("role", "treeitem");
    const fullPath = parentPath ? `${parentPath}/${entry.name}` : entry.name;
    row.innerHTML = `<span class="files-icon">${entry.is_dir ? "▸" : "·"}</span>` +
      `<span class="files-name">${escHtml(entry.name)}</span>${gitBadge(entry.git)}`;
    const nameEl = row.querySelector(".files-name");
    row.appendChild(filesRenameOrDelete(entry, fullPath, parentPath, container, nameEl));
    if (!entry.is_dir) {
      row.onclick = () => openFile(fullPath);
      return [row];
    }
    const children = document.createElement("div");
    children.className = "files-children";
    row.onclick = () => {
      const icon = row.querySelector(".files-icon");
      const isOpen = children.classList.toggle("open");
      icon.textContent = isOpen ? "▾" : "▸";
      if (isOpen && !children.dataset.loaded) {
        children.dataset.loaded = "1";
        loadFilesInto(children, fullPath);
      }
    };
    return [row, children];
  };

  const loadFilesInto = async (container, path) => {
    container.innerHTML = `<div class="files-empty">loading…</div>`;
    const data = await fetchJson(`files?path=${encodeURIComponent(path)}`);
    container.innerHTML = "";
    if (!data || !Array.isArray(data.entries) || !data.entries.length) {
      container.innerHTML = `<div class="files-empty">${data ? "empty" : "failed to load"}</div>`;
      return;
    }
    for (const entry of data.entries) {
      for (const el of filesRow(entry, path, container)) container.appendChild(el);
    }
  };

  const loadFilesTree = () => {
    filesTree.dataset.loaded = "1";
    loadFilesInto(filesTree, "");
  };
  document.getElementById("files-refresh").onclick = () => {
    delete filesTree.dataset.loaded;
    filesFlatCache = null;
    loadFilesTree();
  };

  const diffLineClass = (line) => {
    if (line.startsWith("+") && !line.startsWith("+++")) return "add";
    if (line.startsWith("-") && !line.startsWith("---")) return "del";
    if (line.startsWith("@@")) return "hunk";
    return "";
  };

  const renderFileBody = () => {
    if (!currentFile) return;
    filesDiffBtn.hidden = false;
    filesDiffBtn.textContent = showingDiff ? "content" : "diff";
    filesSaveBtn.hidden = showingDiff || currentFile.binary || currentFile.tooLarge;
    if (showingDiff) {
      filesViewBody.innerHTML = `<div class="files-note">loading diff…</div>`;
      fetchJson(`git/diff?path=${encodeURIComponent(currentFile.path)}`).then((d) => {
        if (!d || !d.diff) {
          filesViewBody.innerHTML = `<div class="files-note">no changes against HEAD</div>`;
          return;
        }
        const lines = d.diff.split("\n")
          .map((line) => `<div class="${diffLineClass(line)}">${escHtml(line) || " "}</div>`)
          .join("");
        filesViewBody.innerHTML = `<div class="files-diff">${lines}</div>`;
      });
      return;
    }
    if (currentFile.binary) {
      filesViewBody.innerHTML = `<div class="files-note">binary file — not shown</div>`;
      return;
    }
    if (currentFile.tooLarge) {
      filesViewBody.innerHTML = `<div class="files-note">file too large to display here (over 1.5MB)</div>`;
      return;
    }
    if (isMarkdownPath(currentFile.path) && !currentFile.editing) {
      const node = el("msg assistant", "");
      node.innerHTML = renderMarkdown(currentFile.content);
      highlightCodeBlocks(node);
      const editBtn = document.createElement("button");
      editBtn.className = "mini";
      editBtn.textContent = "edit source";
      editBtn.style.marginTop = "8px";
      editBtn.onclick = () => { currentFile.editing = true; renderFileBody(); };
      filesViewBody.replaceChildren(node, editBtn);
      return;
    }
    if (currentFile.html && !currentFile.editing) {
      const pre = document.createElement("div");
      pre.className = "files-highlight";
      pre.innerHTML = currentFile.html;
      const editBtn = document.createElement("button");
      editBtn.className = "mini";
      editBtn.textContent = "edit source";
      editBtn.style.marginTop = "8px";
      editBtn.onclick = () => { currentFile.editing = true; renderFileBody(); };
      filesViewBody.replaceChildren(pre, editBtn);
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = currentFile.content;
    ta.spellcheck = false;
    ta.oninput = () => { currentFile.content = ta.value; };
    filesViewBody.replaceChildren(ta);
  };

  const openFile = async (path) => {
    filesViewPath.textContent = path;
    filesViewBody.innerHTML = `<div class="files-note">loading…</div>`;
    filesTree.hidden = true;
    filesSearchRow.hidden = true;
    filesView.hidden = false;
    showingDiff = false;
    const data = await fetchJson(`file?path=${encodeURIComponent(path)}`);
    if (!data) {
      filesViewBody.innerHTML = `<div class="files-note">failed to load</div>`;
      currentFile = null;
      return;
    }
    currentFile = {
      path,
      content: data.content || "",
      html: data.html || "",
      binary: !!data.binary,
      tooLarge: !!data.too_large,
      editing: false,
    };
    renderFileBody();
  };

  filesBackBtn.onclick = () => {
    filesView.hidden = true;
    filesTree.hidden = false;
    filesSearchRow.hidden = false;
    currentFile = null;
    // A search still active from before opening this file should keep
    // filtering, not silently fall back to the unfiltered tree.
    if (filesSearchEl.value.trim()) filesSearchEl.oninput();
  };
  filesDiffBtn.onclick = () => { showingDiff = !showingDiff; renderFileBody(); };
  filesSaveBtn.onclick = async () => {
    if (!currentFile) return;
    const r = await postJson("file", { path: currentFile.path, content: currentFile.content });
    toast(r && r.error ? r.error : "saved");
  };

  const sendPrompt = async () => {
    const text = promptEl.value.trim();
    if (!text && !pendingFiles.length) return;
    const files = pendingFiles.splice(0).map(f => ({ name: f.name, media_type: f.mediaType, data: f.data, mode: f.mode }));
    promptEl.value = "";
    autoGrowPrompt();
    renderChips();
    if (await submit("prompt", { text, files })) {
      // Optimistic render: attached images are known in full right now (we
      // hold the bytes), so show them immediately rather than waiting on a
      // reload. A "save" upload's final name isn't known until the backend
      // resolves a collision, so it gets a plain note here; the real,
      // clickable "Uploaded file at ..." line takes over once history
      // (snapshot/reload) reflects what actually landed on disk.
      let label = text;
      const images = [];
      for (const f of files) {
        if (f.mode === "attach") images.push(`data:${f.media_type};base64,${f.data}`);
        else label += `${label ? "\n" : ""}📎 saved ${f.name}`;
      }
      renderUserMessage({ text: label, images });
    }
  };

  const answerPermission = async (answer) => {
    if (!pendingPermission) return;
    if (answer === "deny" && denyGuidance.value.trim()) {
      answer = "deny:" + denyGuidance.value.trim();
    }
    const requestId = pendingPermission.id;
    pendingPermission = null;
    permEl.style.display = "none";
    syncComposerHeight();
    await submit("answer", { request_id: requestId, answer });
  };

  const runCommand = async () => {
    const cmdline = cmdInput.value.trim();
    if (!cmdline) return;
    const ok = await submit("command", { cmdline });
    if (ok) { toast(`ran ${cmdline}`); cmdInput.value = ""; setTimeout(() => { refreshOptions(); refreshSessions(); }, 600); }
  };
  const setModel = async (spec) => {
    if (!spec) return;
    const j = await postJson("model", { spec });
    if (j && j.spec) { toast(`model → ${j.spec}`); modelEl.textContent = j.spec; reflectModel(j.spec); }
    else toast((j && j.error) || "model change failed");
  };
  const refreshSessions = async () => {
    const data = await fetchJson("sessions");
    if (!data || !Array.isArray(data.sessions)) return;
    sessionsBar.replaceChildren();
    const label = document.createElement("span");
    label.textContent = "sessions:";
    sessionsBar.appendChild(label);
    // Page lives at /{token}/ or /{token}/s/{id}/; buttons open the target
    // session's own scoped page, which pins every request to it.
    const token = location.pathname.split('/')[1] || "";
    for (const s of data.sessions) {
      const b = document.createElement("button");
      b.className = "sess mini" + (s.focused ? " focused" : "");
      b.textContent = `${s.title || s.id.slice(0,8)} · ${s.model || ""}`;
      b.title = s.id;
      b.onclick = () => { location.href = `/${token}/s/${s.id}/`; };
      sessionsBar.appendChild(b);
    }
    // A single-session roster is just the tab you're already looking at —
    // showing it wastes a whole row, especially on a phone.
    sessionsBar.style.display = data.sessions.length > 1 ? "flex" : "none";
  };

  // The model <select> is filtered by the provider <select> but always keeps
  // the current spec, even when it belongs to a provider now filtered out.
  const reflectModel = (spec) => {
    if (!spec) return;
    const want = providerSelect.value;
    if (!want) modelSelect.value = spec;
    if (modelSelect.value !== spec) {
      const opt = document.createElement("option");
      opt.value = spec; opt.textContent = spec; opt.dataset.current = "1";
      modelSelect.prepend(opt);
      modelSelect.value = spec;
    }
  };

  const rebuildModelSelect = () => {
    const current = modelEl.textContent;
    const want = providerSelect.value;
    modelSelect.replaceChildren();
    for (const spec of allModels) {
      if (want && !spec.startsWith(want + "/")) continue;
      const o = document.createElement("option");
      o.value = spec; o.textContent = spec;
      modelSelect.appendChild(o);
    }
    if (current && ![...modelSelect.options].some((o) => o.value === current)) {
      const o = document.createElement("option");
      o.value = current; o.textContent = current; o.dataset.current = "1";
      modelSelect.prepend(o);
    }
    if (current) modelSelect.value = current;
  };

  const refreshOptions = async () => {
    const o = await fetchJson("options");
    if (!o) return;
    allModels = Array.isArray(o.models) ? o.models : allModels;
    const known = [...new Set(allModels.map((s) => s.split("/")[0]))];
    const keep = providerSelect.value;
    providerSelect.replaceChildren();
    const all = document.createElement("option");
    all.value = ""; all.textContent = "all providers";
    providerSelect.appendChild(all);
    for (const p of (o.providers || known)) {
      const opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      providerSelect.appendChild(opt);
    }
    providerSelect.value = keep;
    modelEl.textContent = o.model || modelEl.textContent;
    rebuildModelSelect();
    if (o.mode) modeSelect.value = o.mode;
    if (typeof o.yolo === "boolean") yoloCheck.checked = o.yolo;
  };

  let allCommands = [];
  const refreshCommands = async () => {
    const list = await fetchJson("commands");
    if (Array.isArray(list)) allCommands = list;
  };

  // ---- command dropdown: fuzzy search over /commands, like a plugin
  // picker's own filtering rather than the browser's native <datalist>
  // (prefix-only matching in most browsers, unthemeable popup). -----------
  let cmdMatches = [];
  let cmdActive = -1;

  // Subsequence match, case-insensitive: every character of the query must
  // appear in the candidate in order, not necessarily contiguous, so "cpt"
  // still finds "/compact". Score rewards runs of consecutive matches and
  // an early first hit, so tighter/earlier matches sort first — the same
  // heuristic a fuzzy file-jump picker uses.
  const fuzzyScore = (query, text) => {
    if (!query) return 0;
    const q = query.toLowerCase();
    const t = text.toLowerCase();
    let qi = 0, score = 0, streak = 0, firstIdx = -1;
    for (let ti = 0; ti < t.length && qi < q.length; ti++) {
      if (t[ti] === q[qi]) {
        if (firstIdx === -1) firstIdx = ti;
        streak++;
        score += streak;
        qi++;
      } else {
        streak = 0;
      }
    }
    return qi === q.length ? score - firstIdx * 0.1 : -1;
  };

  // Wraps the characters fuzzyScore actually matched in <mark>, walking the
  // exact same subsequence so the highlight always agrees with the score.
  const fuzzyMark = (query, text) => {
    if (!query) return escHtml(text);
    const q = query.toLowerCase();
    const t = text.toLowerCase();
    let qi = 0, out = "";
    for (let ti = 0; ti < text.length; ti++) {
      if (qi < q.length && t[ti] === q[qi]) {
        out += `<mark>${escHtml(text[ti])}</mark>`;
        qi++;
      } else {
        out += escHtml(text[ti]);
      }
    }
    return out;
  };

  const closeCmdDropdown = () => {
    cmdDropdown.hidden = true;
    cmdDropdown.replaceChildren();
    cmdMatches = [];
    cmdActive = -1;
    cmdInput.setAttribute("aria-expanded", "false");
    cmdInput.removeAttribute("aria-activedescendant");
  };

  const setCmdActive = (idx) => {
    const rows = cmdDropdown.querySelectorAll(".cmd-opt");
    rows.forEach((r) => r.classList.remove("active"));
    cmdActive = idx;
    if (idx < 0 || idx >= rows.length) {
      cmdInput.removeAttribute("aria-activedescendant");
      return;
    }
    const row = rows[idx];
    row.classList.add("active");
    row.scrollIntoView({ block: "nearest" });
    cmdInput.setAttribute("aria-activedescendant", row.id);
  };

  // Replaces just the command token with the picked name, keeping whatever
  // the user already typed after it (e.g. picking "/model" mid-way through
  // "mod gpt-5" must not drop " gpt-5") — falls back to a trailing space so
  // there's somewhere to type args when nothing followed yet.
  const pickCmd = (name) => {
    const raw = cmdInput.value;
    const restIdx = raw.search(/\s/);
    const rest = restIdx === -1 ? "" : raw.slice(restIdx);
    cmdInput.value = name + (rest || " ");
    closeCmdDropdown();
    cmdInput.focus();
    const pos = cmdInput.value.length;
    cmdInput.setSelectionRange(pos, pos);
  };

  const renderCmdDropdown = () => {
    const raw = cmdInput.value;
    // Only the bare command token is matched against — args typed after a
    // space (e.g. "/model gpt-5") would otherwise never match anything.
    const query = raw.trim().split(/\s/, 1)[0].replace(/^\//, "");
    cmdMatches = allCommands
      .map((c) => ({ c, score: fuzzyScore(query, c.name.replace(/^\//, "")) }))
      .filter((m) => m.score >= 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 40)
      .map((m) => m.c);

    if (!cmdMatches.length) {
      cmdDropdown.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "cmd-empty";
      empty.textContent = allCommands.length ? "no matching commands" : "loading commands…";
      cmdDropdown.appendChild(empty);
      cmdDropdown.hidden = false;
      cmdInput.setAttribute("aria-expanded", "true");
      cmdActive = -1;
      return;
    }

    cmdDropdown.replaceChildren();
    cmdMatches.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "cmd-opt";
      row.id = `cmd-opt-${i}`;
      row.setAttribute("role", "option");
      const name = document.createElement("span");
      name.className = "cmd-name";
      name.innerHTML = fuzzyMark(query, c.name.replace(/^\//, ""));
      name.prepend("/");
      const desc = document.createElement("span");
      desc.className = "cmd-desc";
      desc.textContent = c.description || "";
      row.appendChild(name);
      row.appendChild(desc);
      // mousedown (not click) fires before the input's blur, so picking a
      // row never races the dropdown closing itself first.
      row.addEventListener("mousedown", (ev) => { ev.preventDefault(); pickCmd(c.name); });
      cmdDropdown.appendChild(row);
    });
    cmdDropdown.hidden = false;
    cmdInput.setAttribute("aria-expanded", "true");
    setCmdActive(cmdMatches.length ? 0 : -1);
  };

  cmdInput.addEventListener("input", renderCmdDropdown);
  cmdInput.addEventListener("focus", () => { if (cmdInput.value.trim()) renderCmdDropdown(); });
  cmdInput.addEventListener("blur", () => setTimeout(closeCmdDropdown, 0));
  document.addEventListener("click", (ev) => {
    if (!cmdDropdown.hidden && !ev.target.closest(".cmd-wrap")) closeCmdDropdown();
  });

  document.getElementById("send").onclick = sendPrompt;
  document.getElementById("cmd-run").onclick = runCommand;
  // ---- uploads ----------------------------------------------------------
  const pendingFiles = [];
  const MAX_UPLOAD = 16 * 1024 * 1024;
  const chipsEl = document.getElementById("chips");
  const fileInput = document.getElementById("file-input");
  document.getElementById("btn-attach").onclick = () => fileInput.click();
  const toBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const renderChips = () => {
    chipsEl.innerHTML = "";
    for (const [i, f] of pendingFiles.entries()) {
      const chip = document.createElement("span");
      chip.className = "chip";
      const name = document.createElement("span");
      name.textContent = f.name;
      const mode = document.createElement("select");
      mode.title = "attach: send it to the model · save: drop it in the session's directory";
      for (const [value, label] of [["attach", "attach"], ["save", "save"]]) {
        const opt = document.createElement("option");
        opt.value = value; opt.textContent = label; opt.selected = f.mode === value;
        mode.appendChild(opt);
      }
      mode.onchange = () => { f.mode = mode.value; };
      const drop = document.createElement("button");
      drop.textContent = "×";
      drop.onclick = () => { pendingFiles.splice(i, 1); renderChips(); };
      chip.append(name, mode, drop);
      chipsEl.appendChild(chip);
    }
    syncComposerHeight();
  };
  const addFiles = async (files) => {
    for (const file of files) {
      if (file.size > MAX_UPLOAD) { toast(`${file.name} is over 16MB`); continue; }
      try {
        pendingFiles.push({
          name: file.name,
          mediaType: file.type || "application/octet-stream",
          data: await toBase64(file),
          mode: (file.type || "").startsWith("image/") ? "attach" : "save",
        });
      } catch { toast(`could not read ${file.name}`); }
    }
    renderChips();
  };
  fileInput.onchange = async () => {
    await addFiles(fileInput.files);
    fileInput.value = "";
  };
  // A screenshot pasted straight into the composer attaches the same way a
  // picked file would — the common case on a desktop far outweighs anyone
  // pasting an image while actually meaning to paste text over it.
  promptEl.addEventListener("paste", (ev) => {
    const items = [...(ev.clipboardData?.items || [])].filter((i) => i.kind === "file");
    if (!items.length) return;
    ev.preventDefault();
    const files = items.map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) addFiles(files);
  });

  // ---- control center ---------------------------------------------------
  const centerBtn = document.getElementById("center-btn");
  const centerEl = document.getElementById("center");
  let centerData = null;

  const loadCenter = async () => {
    const inst = await fetchJson("center");
    let anchor = null;
    if (isSharePage) {
      try {
        const r = await fetch(`/api/center?link=${SHARE_TOKEN}`, { headers: { accept: "application/json" } });
        if (r.ok) anchor = await r.json();
      } catch {}
    }
    centerData = { inst, anchor };
    renderCenter();
  };

  // A minimal inline-SVG line chart — no library worth pulling in for one
  // sparkline. `min` forces the baseline to 0 (cost/percent never sensibly
  // start elsewhere); omitted, the chart auto-fits its own value range.
  const renderSparkline = (values, min) => {
    if (values.length < 2) return "";
    const w = 240, h = 32, pad = 2;
    const lo = min ?? Math.min(...values);
    const hi = Math.max(...values, lo + 0.0001);
    const pts = values.map((v, i) => {
      const x = pad + (i / (values.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - lo) / (hi - lo)) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">` +
      `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
  };

  const renderCenter = () => {
    if (!centerData) { centerEl.innerHTML = "loading…"; return; }
    const { inst, anchor } = centerData;
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let html = "";
    if (usageHistory.length > 1) {
      const costs = usageHistory.map((p) => p.cost);
      const pcts = usageHistory.map((p) => p.contextWindow ? (p.contextSize / p.contextWindow * 100) : 0);
      html += `<h3>Usage this session</h3>`;
      html += `<div class="row" style="color:var(--muted);font-size:11px;">cost — $${costs[costs.length - 1].toFixed(3)}</div>`;
      html += renderSparkline(costs, 0);
      html += `<div class="row" style="color:var(--muted);font-size:11px;margin-top:4px;">context fill — ${Math.round(pcts[pcts.length - 1])}%</div>`;
      html += renderSparkline(pcts, 0);
    }
    const viewers = (inst && inst.viewers) || [];
    html += `<h3>Watchers</h3>`;
    if (!viewers.length) {
      html += `<div class="row bad">nobody watching this instance right now</div>`;
    } else {
      for (const v of viewers) {
        html += `<div class="row"><span class="ok">${esc(v.tag)}</span> <span style="color:var(--muted)">on ${v.session ? esc(v.session.slice(0, 8)) : "all tabs"}</span></div>`;
      }
    }
    if (anchor) {
      html += `<h3>Instance</h3><div class="row"><b>${esc(anchor.instance.name)}</b> <span class="${anchor.online ? "ok" : "bad"}">${anchor.online ? "online" : "offline"}</span> · you: ${esc(anchor.me ? anchor.me.name : "?")} (${esc(anchor.rights)})</div>`;
      const tabs = [];
      if (anchor.links) for (const l of anchor.links) {
        const who = l.session ? `tab ${esc(l.session.slice(0, 8))}` : "all tabs";
        const href = l.token ? `/${l.token}/${l.session ? "s/" + encodeURIComponent(l.session) + "/" : ""}` : "";
        tabs.push(`<tr><td>${esc(l.rights)} · ${who}</td><td>${href ? `<a href="${href}" target="_blank">open</a>` : "—"}</td><td>${anchor.can_manage && l.hash ? `<button class="mini" data-revoke="${esc(l.hash)}">revoke</button>` : ""}</td></tr>`);
      }
      if (anchor.can_manage) {
        html += `<h3>Invite</h3><div class="row"><select id="c-rights"><option value="view">view</option><option value="control">control</option></select><input id="c-hours" type="number" min="1" value="2" style="width:52px"><button class="mini" id="c-mint">create link</button></div><div id="c-invite"></div>`;
        html += `<h3>Live links</h3><table>${tabs.join("")}</table><div class="row"><button class="mini" id="c-close">close this link</button> <button class="mini" id="c-qr">show QR</button></div>`;
      } else {
        html += `<div class="row" style="color:var(--muted)">signed in without manage rights</div>`;
      }
      html += `<div id="c-qr-slot"></div>`;
    } else if (isSharePage) {
      html += `<div class="row" style="color:var(--muted)">management needs an anchor sign-in; you are on a share link</div><div class="row"><button class="mini" id="c-qr">show QR</button></div><div id="c-qr-slot"></div>`;
    } else {
      html += `<div class="row" style="color:var(--muted)">this is not an anchor share page</div>`;
    }
    centerEl.innerHTML = html;
    for (const b of centerEl.querySelectorAll("[data-revoke]")) {
      b.onclick = async () => {
        const r = await postJson("/api/links/revoke", { token_hash: b.dataset.revoke, link: SHARE_TOKEN });
        if (r.error) toast(r.error); else loadCenter();
      };
    }
    const mint = centerEl.querySelector("#c-mint");
    if (mint) mint.onclick = async () => {
      const rights = centerEl.querySelector("#c-rights").value;
      const hours = Number(centerEl.querySelector("#c-hours").value || 2);
      const r = await postJson("/api/links/mint", { link: SHARE_TOKEN, rights, hours });
      if (r.error) { toast(r.error); return; }
      const url = location.origin + r.path;
      centerEl.querySelector("#c-invite").innerHTML = `<div class="row"><a href="${r.path}" target="_blank">${esc(r.path)}</a></div><img class="qr" src="/qr?text=${encodeURIComponent(url)}" width="120" height="120">`;
    };
    const close = centerEl.querySelector("#c-close");
    if (close) close.onclick = async () => {
      if (!confirm("Close this share link? Current viewers are dropped.")) return;
      const r = await postJson("/api/links/close", { link: SHARE_TOKEN });
      if (r.error) toast(r.error); else { centerEl.innerHTML = "<h3>Closed</h3><div class='row'>this link no longer works</div>"; }
    };
    for (const b of centerEl.querySelectorAll("#c-qr")) b.onclick = () => {
      const slot = centerEl.querySelector("#c-qr-slot");
      if (slot.firstChild) { slot.innerHTML = ""; return; }
      const img = document.createElement("img");
      img.className = "qr"; img.width = 140; img.height = 140;
      img.src = `qr?text=${encodeURIComponent(location.href)}`;
      slot.appendChild(img);
    };
  };

  const qrPop = document.getElementById("qr-pop");
  document.getElementById("qr-btn").onclick = (ev) => {
    ev.stopPropagation();
    if (!qrPop.hidden) { qrPop.hidden = true; return; }
    qrPop.innerHTML = "";
    const img = document.createElement("img");
    img.className = "qr"; img.width = 168; img.height = 168;
    img.src = `qr?text=${encodeURIComponent(location.href)}`;
    const link = document.createElement("a");
    link.href = location.href; link.textContent = location.pathname;
    qrPop.append(img, link);
    qrPop.hidden = false;
  };
  document.addEventListener("click", (ev) => {
    if (!qrPop.hidden && !qrPop.contains(ev.target)) qrPop.hidden = true;
  });

  centerBtn.onclick = () => {
    centerEl.hidden = !centerEl.hidden;
    if (!centerEl.hidden) loadCenter();
  };
  document.addEventListener("click", (ev) => {
    if (!centerEl.hidden && !centerEl.contains(ev.target) && ev.target !== centerBtn) centerEl.hidden = true;
  });

  document.getElementById("btn-fast").onclick = () => submit("command", { cmdline: "/fast" }).then(ok => ok && toast("toggled /fast"));
  document.getElementById("btn-thinking").onclick = () => {
    const v = prompt("thinking: off / adaptive / high / low (blank toggles)", "");
    if (v !== null) submit("command", { cmdline: "/thinking " + v }).then(ok => ok && toast("thinking updated"));
  };
  document.getElementById("btn-new").onclick = () => submit("command", { cmdline: "/new" }).then(ok => ok && toast("new session"));
  document.getElementById("btn-compact").onclick = () => submit("command", { cmdline: "/compact" }).then(ok => ok && toast("compact queued"));
  cmdInput.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown" && !cmdDropdown.hidden) {
      ev.preventDefault();
      setCmdActive(Math.min(cmdActive + 1, cmdMatches.length - 1));
    } else if (ev.key === "ArrowUp" && !cmdDropdown.hidden) {
      ev.preventDefault();
      setCmdActive(Math.max(cmdActive - 1, 0));
    } else if (ev.key === "Escape" && !cmdDropdown.hidden) {
      ev.preventDefault();
      closeCmdDropdown();
    } else if (ev.key === "Tab" && !cmdDropdown.hidden && cmdActive >= 0) {
      // Tab completes the active match into the box without running it yet,
      // matching a shell/plugin picker's own Tab behavior.
      ev.preventDefault();
      pickCmd(cmdMatches[cmdActive].name);
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      // A highlighted dropdown row means the box holds a partial query the
      // user hasn't committed to yet — Enter fills it in first (preserving
      // any args already typed after it), same as a click, rather than
      // running the raw partial text.
      if (!cmdDropdown.hidden && cmdActive >= 0 && cmdMatches[cmdActive]) {
        pickCmd(cmdMatches[cmdActive].name);
      }
      closeCmdDropdown();
      runCommand();
    }
  });
  providerSelect.onchange = rebuildModelSelect;
  modelSelect.onchange = () => { if (modelSelect.value) setModel(modelSelect.value); };
  modeSelect.onchange = async () => {
    const j = await postJson("options", { mode: modeSelect.value });
    if (j && !j.error) toast(`mode: ${modeSelect.value}`); else { toast((j && j.error) || "mode change failed"); refreshOptions(); }
  };
  yoloCheck.onchange = async () => {
    const j = await postJson("options", { yolo: yoloCheck.checked });
    if (j && !j.error) toast(`yolo ${yoloCheck.checked ? "on" : "off"}`); else refreshOptions();
  };
  promptEl.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      // slash at start → route to command endpoint so autocomplete, model, etc. work from the main box too
      const t = promptEl.value.trim();
      if (t.startsWith("/")) { cmdInput.value = t; promptEl.value = ""; autoGrowPrompt(); runCommand(); return; }
      sendPrompt();
    }
  });
  stopBtn.onclick = () => submit("stop", {});
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && statusEl.dataset.status === "working") submit("stop", {});
  });
  permEl.addEventListener("click", (ev) => {
    const answer = ev.target?.dataset?.answer;
    if (!answer) return;
    if (answer === "deny") {
      denyGuidance.style.display = denyGuidance.style.display === "none" ? "block" : "none";
      if (!denyGuidance.value.trim()) return;
    }
    answerPermission(answer);
  });

  connect();
  refreshOptions();
  refreshCommands();
  refreshSessions();
  setInterval(() => { refreshSessions(); refreshOptions(); }, 8000);
  promptEl.focus();
  // Installability only (no offline cache) — lets a phone add this share
  // link to its home screen as its own app instead of a browser tab.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
