<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes the env(safe-area-inset-*) values below
     resolve to anything but 0 on a notched/gesture-bar phone; without it the
     header and composer would still be laid out inside the safe area but
     couldn't paint their backgrounds under the notch. interactive-widget lets
     the layout viewport (and so `100dvh`) shrink when the on-screen keyboard
     opens, keeping the composer above it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>maki remote</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #16181d;
    --panel: #1d2026;
    --border: #2c313a;
    --text: #d6dbe3;
    --muted: #8b93a1;
    --accent: #7aa2f7;
    --user: #9ece6a;
    --error: #f7768e;
    --tool: #bb9af7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    /* The app column never scrolls as a whole (only <main> does), so let the
       browser skip pull-to-refresh / rubber-banding at its edges. */
    overscroll-behavior: none;
  }
  /* iOS Safari (and any browser ignoring interactive-widget) shrinks only the
     *visual* viewport when the keyboard opens, so 100dvh keeps the composer
     underneath it. The keyboard watcher in JS pins the app to the visible
     region instead while that's happening. */
  body.kb-open { height: var(--kb-h, 100dvh); }
  header {
    display: flex;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
    padding: 8px 14px;
    padding-top: calc(8px + env(safe-area-inset-top));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover { color: var(--accent); text-decoration: underline; }
  /* Ellipsized rather than left to wrap: a long session title (this is
     often a full auto-generated sentence, not a short label) used to wrap
     across its own 2-3 lines even in expanded mode, which was most of what
     made the header tall on a narrow screen before compact mode kicked in
     (or when it hadn't, e.g. an explicit "expand" choice, or the moment
     before the live-viewport default above applies). min-width:0 is what
     lets a flex child actually shrink below its content size to make room
     for the ellipsis instead of overflowing the row. */
  #title { color: var(--text); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cwd, #model { color: var(--muted); font-size: 12px; }
  #status { color: var(--muted); }
  #status[data-status="working"] { color: var(--accent); }
  #stats { color: var(--muted); font-size: 12px; margin-left: auto; }
  #conn { color: var(--muted); font-size: 12px; }
  #conn[data-conn="live"] { color: var(--user); }
  #conn[data-conn="down"] { color: var(--error); }
  /* One-time nudge for "Add to Home Screen" / notification permission — the
     🔕/QR icons already do both, but nothing pointed at them, so most
     visitors never discovered either. Sits in normal flow under the
     header, not floated, so it never overlaps the panel cards or toast. */
  #install-banner {
    display: none;
    align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    font-size: 12.5px;
  }
  #install-banner[hidden] { display: none; }
  #install-banner:not([hidden]) { display: flex; }
  #install-banner-text { color: var(--muted); flex: 1; min-width: 160px; }
  #install-banner button.mini { flex: none; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
  }
  .msg { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .msg.user { color: var(--user); }
  .msg.user::before { content: "you> "; color: var(--muted); }
  .msg.user a.upload-link { color: var(--accent); text-decoration: none; }
  .msg.user a.upload-link:hover { text-decoration: underline; }
  .msg.user img.upload-thumb {
    display: inline-block; max-width: 240px; max-height: 240px;
    margin-top: 4px; border-radius: 6px; border: 1px solid var(--border);
  }
  .msg.assistant { color: var(--text); }
  .msg.thinking { color: var(--muted); font-style: italic; }
  /* Code stays upright even inside the block's overall italic — an
     italicized monospace code span reads badly and isn't how the CLI
     shows it either. */
  .msg.thinking code, .msg.thinking pre { font-style: normal; }
  .msg.error { color: var(--error); }
  .msg.system { color: var(--muted); }
  .tool { margin: 6px 0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; background: var(--panel); }
  .tool summary { color: var(--tool); cursor: pointer; user-select: none; }
  .tool .out { white-space: pre-wrap; word-break: break-word; color: var(--muted); margin-top: 4px; max-height: 300px; overflow-y: auto; }
  .tool .out img.tool-thumb {
    display: block; max-width: min(480px, 100%); max-height: 480px;
    border-radius: 6px; border: 1px solid var(--border);
  }
  .tool .out .tool-thumb-caption { margin-top: 4px; }
  .tool.running summary::after { content: " …"; color: var(--accent); }
  .tool.is-error { border-color: var(--error); }
  /* Matches the CLI (tool_display.rs), which colors a finished tool's name
     green/red for success/failure instead of leaving it the same purple a
     still-running or never-run tool shows. */
  .tool.is-error summary { color: var(--error); }
  .tool.is-ok summary { color: var(--user); }
  #perm {
    display: none;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--panel);
    padding: 10px 14px;
    margin: 8px 14px;
  }
  #perm .toolname { color: var(--accent); }
  #perm .scopes { color: var(--muted); margin: 4px 0 8px; }
  #perm .row { display: flex; flex-wrap: wrap; gap: 8px; }
  #perm textarea {
    width: 100%;
    min-height: 60px;
    margin-top: 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    display: none;
  }
  button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  button.primary { border-color: var(--user); color: var(--user); }
  button.danger { border-color: var(--error); color: var(--error); }
  button.mini { padding: 2px 8px; font-size: 12px; }
  #toolbar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  /* Author rules always beat the UA `[hidden]` default regardless of
     specificity, so #toolbar's own `display: flex` above would otherwise
     win over a bare `hidden` attribute; this rule restores it. */
  #toolbar[hidden] { display: none; }
  #toolbar input, #toolbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
    font-size: 12px;
  }
  #toolbar label.mini { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; padding: 0 4px; }
  #toolbar #provider-select { max-width: 160px; }
  #toolbar #model-select { max-width: 240px; }
  .cmd-wrap { position: relative; flex: 1; min-width: 160px; }
  .cmd-wrap #cmd-input { width: 100%; }
  /* Custom fuzzy-search dropdown replacing the native <datalist> — that
     widget only prefix-matches in most browsers and its popup styling
     can't be themed, both of which stood out badly against everything
     else here. */
  #cmd-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 65;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    /* vh-capped too, so the list still fits between the toolbar and an open
       on-screen keyboard instead of running off the bottom of the screen. */
    max-height: min(260px, 40vh); overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #cmd-dropdown[hidden] { display: none; }
  .cmd-opt {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 10px; cursor: pointer; font-size: 12.5px;
  }
  .cmd-opt .cmd-name { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .cmd-opt .cmd-desc {
    color: var(--muted); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cmd-opt mark { background: none; color: var(--user); font-weight: 700; }
  .cmd-opt.active, .cmd-opt:hover { background: rgba(122,162,247,.16); }
  .cmd-empty { padding: 6px 10px; color: var(--muted); font-size: 12.5px; }
  #sessions-bar {
    display: none;
    gap: 6px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
  }
  #sessions-bar span { color: var(--muted); font-size: 12px; }
  #sessions-bar .sess { cursor: pointer; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
  #sessions-bar .sess.focused { border-color: var(--accent); color: var(--accent); }
  /* Everything that floats above the composer is positioned off its measured
     height (kept in --composer-h by JS) rather than a hardcoded 80-96px:
     compact mode, the safe-area inset and the auto-growing textarea all move
     that edge, and the old constants only matched one of those cases. */
  #toast {
    position: fixed;
    bottom: calc(var(--composer-h, 64px) + 16px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    display: none;
    max-width: 80vw;
  }
  #stoprow { padding: 4px 14px; }
  #stoprow button { display: none; }
  #inputrow {
    display: flex;
    gap: 8px;
    /* flex-end, not the default stretch: once the textarea auto-grows toward
       its 200px max the send/attach buttons would otherwise grow with it. */
    align-items: flex-end;
    padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  /* With flex-end above, the two buttons size to their own content and no
     longer match each other; an explicit height keeps them a matched pair
     (and a comfortable thumb target) whatever the textarea is doing. */
  #inputrow button { min-height: 38px; }
  #prompt {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font: inherit;
    resize: none;
    height: 44px;
    max-height: 200px;
    overflow-y: auto;
  }
  #prompt:focus { outline: none; border-color: var(--accent); }
  #center-wrap { position: relative; margin-left: auto; display: flex; gap: 4px; align-items: center; }
  #center {
    position: absolute; top: 130%; right: 0; z-index: 60;
    width: min(340px, 92vw); max-height: 70vh; overflow-y: auto;
    background: var(--panel, #1e2128); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #center h3 { margin: 2px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #center .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  #center table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #center td { padding: 2px 4px; border-bottom: 1px solid var(--border); }
  #center input, #center select { font-size: 12px; padding: 3px 6px; background: var(--bg); color: inherit; border: 1px solid var(--border); border-radius: 6px; }
  #center .ok { color: #9ece6a; } #center .bad { color: #f7768e; }
  #center img.qr, #qr-pop img.qr { background: #fff; border-radius: 8px; padding: 4px; display: block; margin-top: 4px; }
  #qr-pop {
    position: fixed; z-index: 70;
    top: calc(54px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    max-width: calc(100vw - 20px);
    background: var(--panel, #1e2128); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 12px; text-align: center;
  }
  #qr-pop a { color: var(--muted); word-break: break-all; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--muted);
  }
  .chip select { font-size: 11px; background: none; color: inherit; border: none; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; }
  /* Markdown-ish rendering for assistant messages — and, below, thinking
     blocks too: the CLI runs thinking through the same markdown-aware
     renderer as the final answer (just under its own muted/italic color),
     so a bold header or a code span inside a thinking block is styled
     there, not left as literal ** and ` characters. */
  .msg.assistant p, .msg.thinking p { margin: 4px 0; }
  /* The CLI gives every heading level the same single style token — see
     theme.rs's `heading` style, no per-level distinction — so h4-h6 match
     h1-h3 here rather than stepping down in size/weight the way a generic
     HTML stylesheet normally would. */
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3,
  .msg.assistant h4, .msg.assistant h5, .msg.assistant h6,
  .msg.thinking h1, .msg.thinking h2, .msg.thinking h3,
  .msg.thinking h4, .msg.thinking h5, .msg.thinking h6 {
    margin: 8px 0 4px; color: var(--text); font-size: 1em;
  }
  .msg.assistant ul, .msg.assistant ol,
  .msg.thinking ul, .msg.thinking ol { margin: 4px 0; padding-left: 20px; }
  .msg.assistant ul ul, .msg.assistant ul ol,
  .msg.assistant ol ul, .msg.assistant ol ol,
  .msg.thinking ul ul, .msg.thinking ul ol,
  .msg.thinking ol ul, .msg.thinking ol ol { margin: 0; }
  .msg.assistant code, .msg.thinking code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .msg.assistant pre, .msg.thinking pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; }
  .msg.assistant pre code, .msg.thinking pre code { background: none; border: none; padding: 0; }
  .msg.assistant blockquote, .msg.thinking blockquote { border-left: 3px solid var(--border); margin: 4px 0; padding-left: 10px; color: var(--muted); }
  .msg.assistant a, .msg.thinking a { color: var(--accent); }
  .msg.assistant table, .msg.thinking table { border-collapse: collapse; margin: 4px 0; }
  .msg.assistant th, .msg.assistant td,
  .msg.thinking th, .msg.thinking td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  .msg.assistant th, .msg.thinking th { font-weight: 600; background: var(--panel); }
  /* Floating "jump to bottom" button, shown when scrolled away. */
  #jump-bottom {
    position: fixed; z-index: 50;
    right: calc(16px + env(safe-area-inset-right));
    bottom: calc(var(--composer-h, 64px) + 10px);
    display: none; align-items: center; gap: 4px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  #jump-bottom:hover { border-color: var(--accent); color: var(--accent); }
  /* Compact mode: collapse the header to a single line.
     The target is a 360px-wide phone, where the expanded header wraps to
     three or four rows and eats a quarter of the screen. Everything here
     serves one rule: in compact mode the header is exactly one line, with
     #title as the only element allowed to take (and give back) width. */
  body.compact header {
    padding: 4px 10px;
    padding-top: calc(4px + env(safe-area-inset-top));
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
    gap: 8px;
    /* nowrap is the whole point. No `overflow: hidden` to go with it, though:
       the "⋯" menu and the "remote ▾" panel are absolutely positioned inside
       this element and clipping the header would swallow both. Instead the
       two text items below are individually shrinkable and ellipsised, so
       there is never anything to overflow. */
    flex-wrap: nowrap;
    align-items: center;
  }
  body.compact header h1 { font-size: 12px; flex: none; }
  /* The header's own content (cwd, model) is what forced it to wrap across
     several lines on a narrow phone — shrinking padding/font alone left
     that untouched. Both are redundant here (the model is already in the
     toolbar's picker, cwd is rarely needed at a glance), so compact drops
     them entirely rather than just shrinking them. */
  body.compact #cwd, body.compact #model { display: none; }
  /* The flexible item: it takes the leftover width and ellipsizes. The heavy
     flex-shrink makes it give that width back first, so a long session title
     is trimmed long before the (much more informative) status word is. */
  body.compact #title {
    flex: 1 100 auto; min-width: 0; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  body.compact #status {
    flex: 0 1 auto; min-width: 0; font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Full stats ("48.2k/200.0k (24%) · $1.234 · in … out …") is far too wide
     for one phone line, but the context percentage is the one number worth
     glancing at, so compact swaps in the short form `setStats` precomputes.
     The full string is one tap away via "expand", and the control center's
     usage panel carries cost and context fill too. */
  body.compact #stats { flex: none; margin-left: 0; font-size: 0; }
  body.compact #stats::after { content: attr(data-short); font-size: 11px; }
  body.compact #stats:not([data-short]) { display: none; }
  /* Connection state is a colour, not a word, once space is tight — the
     [data-conn] rules above already carry the colour. */
  body.compact #conn {
    flex: none; font-size: 0; display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
  }
  body.compact #center-wrap { flex: none; margin-left: 0; }
  body.compact #toolbar { padding: 2px 10px; }
  body.compact #toolbar input, body.compact #toolbar select { padding: 2px 6px; font-size: 11px; }
  body.compact #sessions-bar { padding: 2px 10px; }
  body.compact #install-banner { padding: 4px 10px; gap: 6px; font-size: 12px; }
  body.compact #inputrow { padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  body.compact #prompt { height: 40px; padding: 6px 8px; }
  #compact-toggle { cursor: pointer; }

  /* The six header buttons: an inline strip when there's room, a drop-down
     behind "⋯" in compact mode. Same elements either way, so every existing
     click handler keeps working untouched. */
  #hdr-tools { display: flex; gap: 4px; align-items: center; }
  #more-btn { display: none; }
  body.compact #more-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; line-height: 1.2;
  }
  body.compact #more-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  body.compact #hdr-tools {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 66;
    /* A fixed 3x2 grid rather than a wrapped flex row: the six labels are
       different widths, so wrapping left a ragged edge and one orphan on the
       second line. Equal cells also give each one a proper thumb target. */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: min(300px, calc(100vw - 20px));
    padding: 8px; gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  body.compact #hdr-tools.open { display: grid; }

  /* File panel: slides out from the left over the transcript. */
  /* A plugin's maki.ui.open_win() float (task/session/memory pickers, the
     question tool's form, ...), mirrored from the terminal as a generic
     modal — see the "window bridge" JS below. */
  #win-backdrop {
    position: fixed; inset: 0; z-index: 95;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  /* Author rules always beat the UA `[hidden]` default regardless of
     specificity — see #toolbar[hidden]/#files-view[hidden] for the same
     fix already needed elsewhere in this file. */
  #win-backdrop[hidden] { display: none; }
  #win-overlay {
    width: min(640px, 100%);
    max-height: 80vh;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #win-title {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 8px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--accent); font-weight: bold;
  }
  #win-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #win-title .mini { margin-left: auto; }
  #win-body {
    flex: 1; overflow-y: auto; padding: 4px 0;
    font-size: 13px;
  }
  #win-body:focus { outline: none; }
  #win-body > div { padding: 1px 14px; white-space: pre-wrap; word-break: break-word; }
  /* A scroll target more than a highlight: most pickers already bake their
     own selection color into the row's spans (see picker.lua), so a strong
     background here would double up against that. This class is now always
     applied to the cursor row (not just when a plugin opts into cursor_line)
     so arrow-key navigation always has something to scroll into view. */
  #win-body > div.win-cursor { box-shadow: inset 2px 0 0 0 var(--accent); }
  #win-footer {
    padding: 6px 14px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px;
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  #win-footer:empty { display: none; }
  #files-backdrop {
    position: fixed; inset: 0; z-index: 89;
    background: rgba(0,0,0,.4);
  }
  #files-panel {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 90;
    width: min(640px, 92vw);
    min-width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 24px rgba(0,0,0,.35);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    display: flex; flex-direction: column;
    transform: translateX(-100%);
    transition: transform .18s ease;
  }
  #files-panel.open { transform: translateX(0); }
  #files-panel.resizing { transition: none; user-select: none; }
  #files-resize {
    position: absolute; top: 0; right: -4px; bottom: 0; width: 8px;
    cursor: ew-resize; z-index: 91; touch-action: none;
  }
  #files-resize:hover, #files-panel.resizing #files-resize { background: rgba(122,162,247,.35); }
  #files-head {
    /* Wraps rather than overflowing: title + branch + four buttons don't fit
       on one line once the panel is 92vw of a 360px phone. */
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  #files-head #files-branch { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files-head .mini:last-child { margin-left: auto; }
  #files-search-row { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  #files-search-row input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-size: 12.5px;
  }
  #files-search-row input:focus { outline: none; border-color: var(--accent); }
  #files-tree {
    flex: 1; overflow-y: auto; padding: 6px 0;
    font-size: 13px;
  }
  .files-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .files-row:hover { background: var(--panel-2, rgba(255,255,255,.05)); }
  .files-row .files-icon { color: var(--muted); width: 1em; flex: none; }
  .files-row .files-name { overflow: hidden; text-overflow: ellipsis; }
  .files-row .files-git {
    margin-left: auto; flex: none; font-size: 10px; font-weight: 700;
    border-radius: 3px; padding: 0 4px; line-height: 1.5;
  }
  .files-row .files-actions { flex: none; display: flex; gap: 2px; margin-left: 4px; }
  .files-row .files-actions button {
    padding: 0 5px; font-size: 11px; line-height: 1.7; color: var(--muted);
  }
  .files-row .files-actions button:hover { color: var(--text); border-color: var(--accent); }
  .files-row .files-actions button.danger { color: var(--error); border-color: var(--error); }
  .files-inline-input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 4px;
    padding: 1px 6px; font: inherit; font-size: 12.5px;
  }
  .files-git[data-code="M"] { color: var(--accent); }
  .files-git[data-code="A"], .files-git[data-code="??"] { color: var(--user); }
  .files-git[data-code="D"] { color: var(--error); }
  .files-git[data-code="R"] { color: var(--tool); }
  .files-git[data-code="*"] { color: var(--muted); }
  .files-children { padding-left: 14px; display: none; }
  .files-children.open { display: block; }
  .files-empty { color: var(--muted); padding: 6px 12px; font-size: 12px; }
  #files-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* Same specificity fix as #toolbar[hidden] above: this rule's own
     `display: flex` would otherwise beat the UA `[hidden]` default, leaving
     the file viewer visibly stacked under the tree after "← tree". */
  #files-view[hidden] { display: none; }
  #files-view-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  #files-view-head .spacer { flex: 1; }
  #files-view-path { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files-view-body { flex: 1; overflow: auto; padding: 10px 12px; }
  #files-view-body textarea {
    width: 100%; height: 100%; min-height: 200px; resize: none;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #files-view-body .msg.assistant { white-space: normal; }
  .files-diff { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .files-diff .add { color: var(--user); }
  .files-diff .del { color: var(--error); }
  .files-diff .hunk { color: var(--tool); }
  .files-highlight { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .files-note { color: var(--muted); font-size: 12.5px; }

  /* Background float panels mirrored non-modally (todo_write's Todos box,
     the memory toast, ...). Unlike #win-backdrop's modal these never take
     input focus locally either, so they float above the transcript without
     blocking it or accepting keystrokes — see the "window bridge" JS. */
  #panels {
    position: fixed; z-index: 40;
    right: calc(14px + env(safe-area-inset-right));
    /* Clears the "↓ latest" pill, which sits in the same corner. */
    bottom: calc(var(--composer-h, 64px) + 52px);
    display: flex; flex-direction: column-reverse; gap: 8px;
    max-width: min(360px, calc(100vw - 28px));
    pointer-events: none;
  }
  .panel-card {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    font-size: 12.5px; overflow: hidden;
    animation: panel-pop-up .18s ease-out;
  }
  @keyframes panel-pop-up {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .panel-card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-bottom: 1px solid var(--border);
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: 11px;
  }
  .panel-card-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel-card-head button { padding: 0 6px; font-size: 12px; line-height: 1.6; }
  .panel-card-body {
    /* vh-capped as well as px-capped: a 20-item todo list on a short phone
       screen would otherwise cover most of the transcript it floats over. */
    padding: 6px 10px; max-height: min(220px, 32vh); overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .panel-card-body div { min-height: 1.4em; }
  .panel-card-foot {
    padding: 3px 10px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 10.5px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .panel-card-foot:empty { display: none; }
  .panel-card.collapsed .panel-card-body, .panel-card.collapsed .panel-card-foot { display: none; }
  /* Compact mode: a small floating card in the corner reads fine with a
     mouse and room to spare, but on an actual phone it's easy to miss and
     awkward to reach — spans edge-to-edge instead, bottom-anchored, closer
     to a native bottom sheet (the pop-up entrance above is the same
     element either way; the difference here is purely width/anchoring).
     (The bottom offset already tracks the composer via --composer-h.) */
  body.compact #panels {
    left: calc(8px + env(safe-area-inset-left));
    right: calc(8px + env(safe-area-inset-right));
    max-width: none;
  }
  body.compact .panel-card { border-radius: 14px 14px 8px 8px; }

  /* ---- touch devices ---------------------------------------------------
     Keyed off pointer:coarse rather than a width breakpoint, because the
     problems here are about fingers, not screen size: .mini's 2px padding
     makes a ~20px tall target, and iOS Safari auto-zooms the page whenever a
     focused field's text is under 16px. */
  @media (pointer: coarse) {
    .mini { padding: 6px 10px; min-height: 34px; }
    /* Rules with a heavier selector than plain `.mini` need repeating. */
    body.compact #more-btn { min-height: 34px; }
    .files-row .files-actions button { padding: 0 9px; min-height: 30px; }
    .panel-card-head button { padding: 0 10px; min-height: 28px; }
    #inputrow button { min-height: 42px; }
    #toolbar label.mini { min-height: 34px; }
    /* 16px minimum on anything focusable: below that, focusing the field
       zooms the whole page on iOS and leaves it zoomed. */
    #prompt, #cmd-input, #files-search, #deny-guidance,
    #toolbar input, #toolbar select, #center input, #center select,
    .files-inline-input, #files-view-body textarea,
    body.compact #toolbar input, body.compact #toolbar select {
      font-size: 16px;
    }
    /* Checkboxes aren't text, so the 16px rule above doesn't help them. */
    #toolbar input[type="checkbox"] { width: 18px; height: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="Back to your maki anchor sessions">maki</a></h1>
  <span id="title"></span>
  <span id="cwd"></span>
  <span id="model"></span>
  <span id="status" data-status="idle">idle</span>
  <span id="stats"></span>
  <span id="conn" data-conn="down">connecting</span>
  <div id="center-wrap">
    <!-- Compact mode only: the six buttons below don't fit on one line at
         phone widths, so they move into a drop-down behind this. -->
    <button class="mini" id="more-btn" title="More actions" aria-label="More actions" aria-expanded="false" aria-controls="hdr-tools">⋯</button>
    <div id="hdr-tools">
      <button class="mini" id="files-btn" title="Browse files">files</button>
      <button class="mini" id="toolbar-toggle" title="Hide/show the toolbar to save space">tools ▾</button>
      <button class="mini" id="compact-toggle" title="Shrink the headers to save space">compact</button>
      <button class="mini" id="notify-btn" title="Get notified when the run stops or needs you">🔕</button>
      <button class="mini" id="qr-btn" title="QR code for this page's link">QR</button>
      <button class="mini" id="center-btn" title="Remote control center">remote ▾</button>
    </div>
    <div id="center" hidden></div>
  </div>
</header>
<div id="install-banner" hidden>
  <span id="install-banner-text"></span>
  <button class="mini primary" id="install-banner-action" hidden>Install</button>
  <button class="mini primary" id="install-banner-notify" hidden>Enable</button>
  <button class="mini" id="install-banner-dismiss" title="Dismiss">×</button>
</div>
<div id="win-backdrop" hidden>
  <div id="win-overlay">
    <div id="win-title"><span id="win-title-text"></span><button class="mini" id="win-close" title="Close (esc)">×</button></div>
    <div id="win-body" tabindex="0"></div>
    <div id="win-footer"></div>
  </div>
</div>
<div id="files-backdrop" hidden></div>
<aside id="files-panel" aria-hidden="true">
  <div id="files-resize" title="Drag to resize"></div>
  <div id="files-head">
    <strong id="files-title">Files</strong>
    <span id="files-branch" class="small"></span>
    <button class="mini" id="files-new-file" title="New file">+file</button>
    <button class="mini" id="files-new-dir" title="New folder">+dir</button>
    <button class="mini" id="files-refresh" title="Refresh">↻</button>
    <button class="mini" id="files-close" title="Close">×</button>
  </div>
  <div id="files-search-row">
    <input id="files-search" placeholder="Jump to file…" autocomplete="off">
  </div>
  <div id="files-tree" role="tree"></div>
  <div id="files-view" hidden>
    <div id="files-view-head">
      <button class="mini" id="files-back" title="Back to tree">← tree</button>
      <span id="files-view-path" class="mono"></span>
      <span class="spacer"></span>
      <button class="mini" id="files-toggle-diff" title="Show what changed" hidden>diff</button>
      <button class="mini primary" id="files-save" title="Save changes" hidden>save</button>
    </div>
    <div id="files-view-body"></div>
  </div>
</aside>
<div id="toolbar">
  <div class="cmd-wrap">
    <input id="cmd-input" placeholder="/command — type to filter, Enter to run" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cmd-dropdown">
    <div id="cmd-dropdown" role="listbox" hidden></div>
  </div>
  <button class="mini" id="cmd-run">Run</button>
  <select id="provider-select" title="Filter models by provider"><option value="">all providers</option></select>
  <select id="model-select" title="Model"><option value="">model…</option></select>
  <select id="mode-select" title="Mode">
    <option value="build">build</option>
    <option value="plan">plan</option>
  </select>
  <label class="mini" title="Auto-approve tool permissions"><input type="checkbox" id="yolo-check"> yolo</label>
  <button class="mini" id="btn-fast" title="Toggle fast mode">/fast</button>
  <button class="mini" id="btn-thinking" title="Set thinking level">/thinking</button>
  <button class="mini" id="btn-new" title="New session">/new</button>
  <button class="mini" id="btn-compact" title="Compact context">/compact</button>
</div>
<div id="sessions-bar"></div>
<main id="log"></main>
<div id="qr-pop" hidden></div>
<div id="toast"></div>
<div id="panels"></div>
<button id="jump-bottom" title="Jump to the latest message">↓ latest</button>
<div id="perm">
  <div>Permission needed: <span class="toolname" id="perm-tool"></span></div>
  <div class="scopes" id="perm-scopes"></div>
  <div class="row">
    <button class="primary" data-answer="allow">Allow</button>
    <button data-answer="allow_session">Allow session</button>
    <button data-answer="allow_always_local">Always (repo)</button>
    <button data-answer="allow_always_global">Always (global)</button>
    <button class="danger" id="deny-btn" data-answer="deny">Deny</button>
  </div>
  <textarea id="deny-guidance" placeholder="Guidance for the agent (optional; submit with the deny button)"></textarea>
</div>
<div id="stoprow"><button class="danger" id="stop">Stop run (Esc)</button></div>
<div id="chips"></div>
<div id="inputrow">
  <button class="mini" id="btn-attach" title="Upload an image or document">+</button>
  <input type="file" id="file-input" multiple hidden>
  <textarea id="prompt" placeholder="Message maki… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send" class="primary">Send</button>
</div>
<script>
(() => {
  const log = document.getElementById("log");
  const connEl = document.getElementById("conn");
  const statusEl = document.getElementById("status");
  const statsEl = document.getElementById("stats");
  const titleEl = document.getElementById("title");
  const cwdEl = document.getElementById("cwd");
  const modelEl = document.getElementById("model");
  const permEl = document.getElementById("perm");
  const promptEl = document.getElementById("prompt");
  // Grows the box with its content up to the CSS max-height (which then
  // scrolls internally), and snaps back down once it's cleared — matching
  // ordinary chat-composer behavior instead of a fixed two-line box.
  const autoGrowPrompt = () => {
    promptEl.style.height = "auto";
    promptEl.style.height = promptEl.scrollHeight + "px";
    syncComposerHeight();
  };
  promptEl.addEventListener("input", autoGrowPrompt);
  // The toast, the "↓ latest" pill and the mirrored panel cards all float
  // just above the composer. Its height isn't a constant — compact mode, the
  // safe-area inset, the auto-growing textarea, the stop button and an open
  // permission card all move that edge — so measure the whole stack below
  // <main> and publish it for the CSS to position off.
  const bottomBars = ["perm", "stoprow", "chips", "inputrow"].map((id) => document.getElementById(id));
  const syncComposerHeight = () => {
    for (const el of bottomBars) {
      const r = el.getBoundingClientRect();
      if (r.height <= 0) continue; // display:none (#perm when idle)
      const h = Math.round(window.innerHeight - r.top);
      if (h > 0) document.documentElement.style.setProperty("--composer-h", h + "px");
      return;
    }
  };
  const stopBtn = document.getElementById("stop");
  const denyGuidance = document.getElementById("deny-guidance");
  const cmdInput = document.getElementById("cmd-input");
  const cmdDropdown = document.getElementById("cmd-dropdown");
  const providerSelect = document.getElementById("provider-select");
  const modelSelect = document.getElementById("model-select");
  const modeSelect = document.getElementById("mode-select");
  const yoloCheck = document.getElementById("yolo-check");
  const SHARE_TOKEN = (location.pathname.split("/")[1] || "").replace(/\/$/, "");
  const isSharePage = /^[0-9a-f]{32}$/.test(SHARE_TOKEN);
  const sessionsBar = document.getElementById("sessions-bar");
  const toastEl = document.getElementById("toast");
  const jumpBtn = document.getElementById("jump-bottom");
  let pendingPermission = null;
  let allModels = [];

  const el = (cls, text) => {
    const node = document.createElement("div");
    node.className = cls;
    node.textContent = text ?? "";
    return node;
  };

  let pinned = true;
  const scrollDown = () => { log.scrollTop = log.scrollHeight; updateJump(); };

  // Show the "jump to bottom" button only when the user has scrolled away
  // from the latest message, so it never gets in the way at the bottom. Also
  // tracks whether the view is "pinned" to the bottom: live updates only
  // autoscroll while pinned, so reading older messages is never interrupted.
  const updateJump = () => {
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    pinned = nearBottom;
    jumpBtn.style.display = nearBottom ? "none" : "flex";
  };
  log.addEventListener("scroll", updateJump);
  jumpBtn.onclick = () => { pinned = true; scrollDown(); };

  // Follow new output only when already pinned to the bottom; otherwise leave
  // the scroll position alone and just keep the jump button in sync.
  const autoScroll = () => { if (pinned) scrollDown(); else updateJump(); };

  // Compact mode: persist the choice so a phone reload keeps the layout.
  const compactToggle = document.getElementById("compact-toggle");
  // The six header buttons live inline when there's room and behind "⋯" in
  // compact mode, where the header has to fit on a single line.
  const moreBtn = document.getElementById("more-btn");
  const hdrTools = document.getElementById("hdr-tools");
  const closeHdrTools = () => {
    hdrTools.classList.remove("open");
    moreBtn.setAttribute("aria-expanded", "false");
  };
  // No stopPropagation here: the "remote ▾" panel and the QR popover close
  // themselves from their own document-level outside-click handlers, and
  // swallowing the event would leave them stuck open behind this menu.
  moreBtn.onclick = () => {
    const open = !hdrTools.classList.contains("open");
    hdrTools.classList.toggle("open", open);
    moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
  };
  // Picking anything in the menu is the end of the interaction, so fold it
  // back up — including for "remote ▾" and "QR", whose panels would otherwise
  // open underneath the still-expanded menu. Capture phase because the QR
  // button stops propagation in its own handler.
  hdrTools.addEventListener("click", (ev) => {
    if (ev.target.closest("button")) closeHdrTools();
  }, true);
  document.addEventListener("click", (ev) => {
    if (hdrTools.classList.contains("open") && !hdrTools.contains(ev.target) && ev.target !== moreBtn) {
      closeHdrTools();
    }
  });
  const applyCompact = (on, persist = true) => {
    document.body.classList.toggle("compact", on);
    compactToggle.textContent = on ? "expand" : "compact";
    // The full hint doesn't fit the shorter compact textarea, where it wraps
    // to two clipped lines instead of reading as placeholder text.
    promptEl.placeholder = on
      ? "Message maki…"
      : "Message maki… (Enter to send, Shift+Enter for newline)";
    closeHdrTools();
    syncComposerHeight();
    // persist=false is the live-viewport default below applying itself —
    // recording that as if it were a real choice would freeze it the first
    // time it ran and defeat the whole point of tracking the viewport.
    if (persist) { try { localStorage.setItem("maki_compact", on ? "1" : "0"); } catch {} }
  };
  compactToggle.onclick = () => applyCompact(!document.body.classList.contains("compact"));
  // No explicit choice yet: live-follow the viewport instead of freezing
  // whatever one page load happened to measure. Without this, a link first
  // opened on a wide screen (defaulting to expanded) stays expanded forever
  // after, even reopened later on a phone — the default only ever ran once,
  // on that first visit, and its result was itself persisted as if it were
  // a deliberate choice. Once the user actually clicks the toggle, that
  // choice is sticky and this stops adjusting.
  const narrowMq = window.matchMedia("(max-width: 599px)");
  try {
    const stored = localStorage.getItem("maki_compact");
    if (stored === null) {
      applyCompact(narrowMq.matches, false);
      narrowMq.addEventListener("change", (ev) => {
        if (localStorage.getItem("maki_compact") === null) applyCompact(ev.matches, false);
      });
    } else {
      applyCompact(stored === "1");
    }
  } catch { applyCompact(window.innerWidth < 600, false); }

  // Toolbar hide/show: the command bar (model picker, /fast, /thinking, ...)
  // is the biggest single chunk of header space on a phone and is rarely
  // touched mid-conversation, so it can be tucked away independently of
  // compact mode. Persisted the same way so a reload keeps the choice.
  const toolbarToggle = document.getElementById("toolbar-toggle");
  const toolbarEl = document.getElementById("toolbar");
  const applyToolbar = (hidden, persist = true) => {
    toolbarEl.hidden = hidden;
    toolbarToggle.textContent = hidden ? "tools ▸" : "tools ▾";
    if (persist) { try { localStorage.setItem("maki_toolbar_hidden", hidden ? "1" : "0"); } catch {} }
  };
  toolbarToggle.onclick = () => applyToolbar(!toolbarEl.hidden);
  // Same live-follow rule as compact mode, and the same reason: an unset
  // preference tracks the viewport on every load instead of freezing
  // whatever the first one happened to measure.
  try {
    const stored = localStorage.getItem("maki_toolbar_hidden");
    if (stored === null) {
      applyToolbar(narrowMq.matches, false);
      narrowMq.addEventListener("change", (ev) => {
        if (localStorage.getItem("maki_toolbar_hidden") === null) applyToolbar(ev.matches, false);
      });
    } else {
      applyToolbar(stored === "1");
    }
  } catch { applyToolbar(window.innerWidth < 600, false); }

  // ---- mobile viewport ---------------------------------------------------
  syncComposerHeight();
  window.addEventListener("resize", syncComposerHeight);
  // iOS Safari (and anything that ignores the viewport meta's
  // interactive-widget hint) shrinks only the *visual* viewport when the
  // on-screen keyboard opens: the layout viewport, and so `100dvh`, stays
  // full height and the composer ends up behind the keyboard. Pin the app
  // column to the visible region for as long as that's happening; when the
  // browser already resizes the layout viewport, the gap never opens and
  // this stays inert.
  const vv = window.visualViewport;
  if (vv) {
    const syncKeyboard = () => {
      const hidden = window.innerHeight - vv.height;
      if (hidden > 120) {
        document.documentElement.style.setProperty("--kb-h", vv.height + "px");
        document.body.classList.add("kb-open");
        // Some browsers scroll the page to reveal the focused field; with the
        // column resized that just pushes the header off-screen.
        if (window.scrollY) window.scrollTo(0, 0);
      } else {
        document.body.classList.remove("kb-open");
      }
      syncComposerHeight();
    };
    vv.addEventListener("resize", syncKeyboard);
    vv.addEventListener("scroll", syncKeyboard);
  }

  // Notifications: opt-in (a page can't silently start popping OS alerts),
  // persisted like the layout toggles, and only for events that actually
  // need you back at the screen — not every text delta.
  const notifyBtn = document.getElementById("notify-btn");
  const notifyEnabled = () => { try { return localStorage.getItem("maki_notify") === "1"; } catch { return false; } };
  const applyNotifyBtn = () => {
    const on = notifyEnabled();
    notifyBtn.textContent = on ? "🔔" : "🔕";
    notifyBtn.title = on ? "Notifications on — click to turn off" : "Get notified when the run stops or needs you";
  };
  // Historical events replayed from a snapshot (page load, reconnect) must
  // never notify — only genuinely new live ones.
  let replaying = false;
  const notify = (title, body) => {
    if (replaying || !notifyEnabled()) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    if (document.visibilityState === "visible") return;
    try { new Notification(title, { body, tag: "maki-remote" }); } catch {}
  };
  notifyBtn.onclick = async () => {
    if (notifyEnabled()) {
      try { localStorage.setItem("maki_notify", "0"); } catch {}
      applyNotifyBtn();
      updateInstallBanner();
      return;
    }
    if (typeof Notification === "undefined") { toast("notifications aren't supported here"); return; }
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { toast("notification permission denied"); updateInstallBanner(); return; }
    try { localStorage.setItem("maki_notify", "1"); } catch {}
    applyNotifyBtn();
    updateInstallBanner();
    new Notification("maki", { body: "You'll be notified when the run stops or needs you." });
  };
  applyNotifyBtn();

  // ---- install / notification nudge --------------------------------------
  // The 🔕/QR icons above already cover notifications and installing, but
  // both are small toolbar buttons nobody stumbles on — this is the same
  // capability surfaced as a one-time banner instead, so a first-time
  // visitor is actually told they exist. Dismissible and remembered per
  // device; each half (install, notify) also drops out on its own once
  // there's nothing left for it to offer.
  const installBanner = document.getElementById("install-banner");
  const installBannerText = document.getElementById("install-banner-text");
  const installBannerAction = document.getElementById("install-banner-action");
  const installBannerNotify = document.getElementById("install-banner-notify");
  const installBannerDismiss = document.getElementById("install-banner-dismiss");
  let deferredInstallPrompt = null;
  const isStandaloneDisplay = () =>
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    window.navigator.standalone === true;
  const isIosSafari = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const installBannerDismissed = () => {
    try { return localStorage.getItem("maki_install_banner_dismissed") === "1"; } catch { return false; }
  };
  const dismissInstallBanner = () => {
    installBanner.hidden = true;
    try { localStorage.setItem("maki_install_banner_dismissed", "1"); } catch {}
  };
  const updateInstallBanner = () => {
    if (installBannerDismissed() || isStandaloneDisplay()) { installBanner.hidden = true; return; }
    const canInstall = !!deferredInstallPrompt;
    // iOS Safari never fires beforeinstallprompt — the only path there is
    // the manual Share-sheet gesture, so just point at it in text.
    const iosHint = !canInstall && isIosSafari();
    const canNotify = typeof Notification !== "undefined" && Notification.permission === "default" && !notifyEnabled();
    if (!canInstall && !iosHint && !canNotify) { installBanner.hidden = true; return; }
    installBannerText.textContent = canInstall
      ? "Install maki for quick access and notifications."
      : iosHint
      ? "Add maki to your Home Screen: Share → Add to Home Screen."
      : "Get notified when a run stops or needs you.";
    installBannerAction.hidden = !canInstall;
    installBannerNotify.hidden = !canNotify;
    installBanner.hidden = false;
  };
  window.addEventListener("beforeinstallprompt", (ev) => {
    ev.preventDefault();
    deferredInstallPrompt = ev;
    updateInstallBanner();
  });
  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    dismissInstallBanner();
  });
  installBannerAction.onclick = async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch {}
    deferredInstallPrompt = null;
    updateInstallBanner();
  };
  // Forwards to the real toolbar button so there is exactly one place that
  // ever calls Notification.requestPermission() — .click() here still runs
  // inside this handler's own user-gesture context, which the permission
  // prompt requires.
  installBannerNotify.onclick = () => { notifyBtn.click(); updateInstallBanner(); };
  installBannerDismiss.onclick = dismissInstallBanner;
  updateInstallBanner();

  const fmtTokens = (n) =>
    n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);

  // A running record of cost/context at each point `setStats` sees new
  // numbers, for the "usage this session" sparkline in the control center.
  // In memory only, cleared on `renderSnapshot` (a fresh page load or
  // reconnect) — a trend across *this* viewing, not a persisted history.
  let usageHistory = [];
  const setStats = (stats) => {
    if (!stats) return;
    const parts = [];
    // Compact mode has room for one number, not the whole string — the CSS
    // swaps in this short form there (see `body.compact #stats`).
    let short = "";
    if (typeof stats.context_size === "number" && stats.context_window) {
      const pct = Math.round(stats.context_size / stats.context_window * 100);
      parts.push(`${fmtTokens(stats.context_size)}/${fmtTokens(stats.context_window)} (${pct}%)`);
      short = `${pct}%`;
    } else if (typeof stats.cost === "number") {
      short = `$${stats.cost.toFixed(2)}`;
    }
    if (short) statsEl.dataset.short = short;
    else delete statsEl.dataset.short;
    if (typeof stats.cost === "number") parts.push(`$${stats.cost.toFixed(3)}`);
    const usage = stats.token_usage || {};
    const inTok = (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) + (usage.cache_read_input_tokens || 0);
    if (inTok || usage.output_tokens) parts.push(`in ${fmtTokens(inTok)} out ${fmtTokens(usage.output_tokens || 0)}`);
    statsEl.textContent = parts.join(" · ");
    if (typeof stats.cost === "number" || typeof stats.context_size === "number") {
      const last = usageHistory[usageHistory.length - 1];
      const point = {
        cost: typeof stats.cost === "number" ? stats.cost : (last ? last.cost : 0),
        contextSize: typeof stats.context_size === "number" ? stats.context_size : (last ? last.contextSize : 0),
        contextWindow: stats.context_window || (last ? last.contextWindow : 0),
      };
      // Collapse runs of identical points (most turns don't move cost or
      // context) so the sparkline's x-axis is "turns that changed something",
      // not padded out with flat stretches.
      if (!last || last.cost !== point.cost || last.contextSize !== point.contextSize) {
        usageHistory.push(point);
      }
    }
  };

  const setHeader = (snap) => {
    if (snap.title) titleEl.textContent = snap.title;
    if (snap.cwd) cwdEl.textContent = snap.cwd;
    if (snap.model) {
      modelEl.textContent = snap.model;
      reflectModel(snap.model);
    }
    setStats(snap);
    if (snap.status) setStatus(snap.status);
  };

  const toast = (msg, ms = 2500) => {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.style.display = "none", ms);
  };

  // `question` (maki's ask-the-user tool, like a Lua plugin's AskUserQuestion)
  // opens a native TUI form via a general Lua windowing API, not a fixed
  // permission-style prompt — there's no remote bridge for that yet, so the
  // best the web view can do is show what's being asked instead of a bare,
  // permanently-empty "question" card that looks like a silent hang.
  const questionPreview = (input) => {
    const qs = input && input.questions;
    if (!Array.isArray(qs) || !qs.length) return "";
    return String(qs[0].question || "").slice(0, 140);
  };
  const renderQuestionBody = (input) => {
    const wrap = document.createElement("div");
    for (const q of (input && input.questions) || []) {
      const block = document.createElement("div");
      block.style.margin = "4px 0 8px";
      const text = document.createElement("div");
      text.textContent = q.question || "";
      block.appendChild(text);
      if (Array.isArray(q.options) && q.options.length) {
        const ul = document.createElement("ul");
        ul.style.margin = "4px 0 0 18px";
        for (const opt of q.options) {
          const li = document.createElement("li");
          li.textContent = opt.description ? `${opt.label} — ${opt.description}` : (opt.label || "");
          ul.appendChild(li);
        }
        block.appendChild(ul);
      }
      wrap.appendChild(block);
    }
    const note = document.createElement("div");
    note.className = "files-note";
    note.textContent = "Answer this at the terminal — the remote view can't fill in maki's interactive question form yet.";
    wrap.appendChild(note);
    return wrap;
  };

  const toolCard = (event) => {
    const details = document.createElement("details");
    details.className = "tool running";
    details.dataset.id = event.id;
    const summary = document.createElement("summary");
    const out = document.createElement("div");
    out.className = "out";
    let label = event.tool || "";
    if (event.tool === "question") {
      const preview = questionPreview(event.input);
      if (preview) label += ` — ${preview}`;
      details.open = true;
    } else if (event.summary) label += ` — ${event.summary}`;
    else if (event.input) {
      const bits = [];
      for (const key of ["command", "path", "file_path", "pattern", "query", "url"]) {
        if (event.input[key]) bits.push(String(event.input[key]).slice(0, 80));
      }
      if (bits.length) label += ` — ${bits.join(" ")}`;
      else {
        // A tool this build has no bespoke summary for — almost always a
        // Lua plugin's own tool, built-in or third-party. Dumping its raw
        // call arguments beats a bare name with an indefinitely empty body,
        // and needs no per-tool knowledge to do.
        const json = JSON.stringify(event.input);
        if (json && json !== "{}" && json !== "null") {
          label += ` — ${json.slice(0, 100)}`;
          out.textContent = JSON.stringify(event.input, null, 2);
        }
      }
    }
    summary.textContent = label;
    details.appendChild(summary);
    details.appendChild(out);
    if (event.tool === "question" && event.input) out.appendChild(renderQuestionBody(event.input));
    log.appendChild(details);
    return details;
  };

  const toolById = (id) => log.querySelector(`.tool[data-id="${CSS.escape(id)}"]`);

  // A tiny, safe markdown renderer for assistant messages: escape first, then
  // apply a small set of block and inline rules. Good enough to read code,
  // lists (ordered and unordered), headings, rules and links the way the CLI
  // does, without a dependency.
  const escHtml = (s) => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  // Code spans are pulled out behind a placeholder before bold/italic/strike
  // run, so `**`/`~~` inside inline code is never reinterpreted as markup.
  const inlineMd = (s) => {
    const spans = [];
    const placeheld = escHtml(s).replace(/`([^`]+)`/g, (_, code) => {
      spans.push(code);
      return ` ${spans.length - 1} `;
    });
    const html = placeheld
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return html.replace(/ (\d+) /g, (_, i) => `<code>${spans[Number(i)]}</code>`);
  };
  const renderMarkdown = (text) => {
    const lines = String(text).split("\n");
    let html = "";
    let inCode = false;
    let codeLang = "";
    let codeBuf = [];
    // Open list levels, outermost first. Each entry's own <li> is left
    // without a closing tag while it's the deepest level, so a following
    // deeper item can nest its <ul>/<ol> right inside that <li> — closed by
    // closeListsDeeperThan/closeAllLists as siblings or dedents come along.
    let listStack = []; // [{type: "ul"|"ol", indent: number}]
    let inTable = false;
    let tableHeader = null; // Array<string> | null — the first row seen
    let tableAligns = []; // "" | "left" | "right" | "center", by column
    let tableBodyRows = [];
    // A paragraph is a run of plain lines; markdown reflows them into one
    // block, so buffer and join with a space rather than emitting a <p> per
    // source line — otherwise every soft-wrapped line reads as its own
    // paragraph, which looks nothing like the CLI's rendering.
    let para = [];
    const closeListsDeeperThan = (indent) => {
      while (listStack.length && listStack[listStack.length - 1].indent > indent) {
        html += `</li></${listStack.pop().type}>`;
      }
    };
    const closeAllLists = () => closeListsDeeperThan(-1);
    // Opens (or continues) a list item at `indent`, nesting inside the
    // current deepest <li> when `indent` is deeper than it, and leaves the
    // new <li> open for a still-deeper item to nest into next.
    const openListItem = (type, indent, contentHtml) => {
      closeListsDeeperThan(indent);
      const top = listStack[listStack.length - 1];
      if (top && top.indent === indent) {
        if (top.type !== type) {
          html += `</li></${listStack.pop().type}><${type}>`;
          listStack.push({ type, indent });
        } else {
          html += "</li>";
        }
      } else {
        html += `<${type}>`;
        listStack.push({ type, indent });
      }
      html += `<li>${contentHtml}`;
    };
    const closeTable = () => {
      if (!inTable) return;
      const alignAttr = (i) => (tableAligns[i] ? ` style="text-align:${tableAligns[i]}"` : "");
      const row = (cells, tag) =>
        `<tr>${cells.map((c, i) => `<${tag}${alignAttr(i)}>${inlineMd(c)}</${tag}>`).join("")}</tr>`;
      html += "<table>";
      if (tableHeader) html += row(tableHeader, "th");
      html += tableBodyRows.map((r) => row(r, "td")).join("");
      html += "</table>";
      inTable = false; tableHeader = null; tableAligns = []; tableBodyRows = [];
    };
    const flushPara = () => {
      if (para.length) { html += `<p>${inlineMd(para.join(" "))}</p>`; para = []; }
    };
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (line.startsWith("```")) {
        flushPara(); closeAllLists(); closeTable();
        if (inCode) {
          // A fence that actually closed: the block's content is final, so
          // it's worth asking the server to syntax-highlight it (see
          // highlightCodeBlocks below). One still open at end-of-text is
          // left plain — its content is still growing on every reveal
          // frame, so there's nothing stable yet worth highlighting.
          html += `<pre><code data-lang="${escHtml(codeLang)}">${escHtml(codeBuf.join("\n"))}</code></pre>`;
          inCode = false; codeBuf = []; codeLang = "";
        } else {
          inCode = true;
          codeLang = line.slice(3).trim().split(/\s+/)[0] || "";
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        flushPara(); closeAllLists();
        const cells = line.split("|").slice(1, -1).map(c => c.trim());
        if (/^[\s:|-]+$/.test(cells.join(""))) {
          // The header/body separator row — read per-column alignment out
          // of it (":--", "--:", ":-:") instead of just discarding it.
          tableAligns = cells.map((c) => {
            const left = c.startsWith(":"), right = c.endsWith(":");
            return left && right ? "center" : right ? "right" : left ? "left" : "";
          });
          continue;
        }
        if (!inTable) { inTable = true; tableHeader = cells; } else { tableBodyRows.push(cells); }
        continue;
      }
      closeTable();
      const bullet = line.match(/^(\s*)[-*]\s+(.*)$/);
      const ordered = !bullet && line.match(/^(\s*)\d+[.)]\s+(.*)$/);
      if (/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
        flushPara(); closeAllLists();
        html += "<hr>";
      } else if (/^#{1,6}\s/.test(line)) {
        flushPara(); closeAllLists();
        const level = line.match(/^#+/)[0].length;
        html += `<h${level}>${inlineMd(line.replace(/^#+\s/, ""))}</h${level}>`;
      } else if (bullet || ordered) {
        flushPara();
        const [, indent, rest] = bullet || ordered;
        openListItem(bullet ? "ul" : "ol", indent.length, inlineMd(rest));
      } else if (/^\s*>\s?/.test(line)) {
        flushPara(); closeAllLists();
        html += `<blockquote>${inlineMd(line.replace(/^\s*>\s?/, ""))}</blockquote>`;
      } else if (line.trim() === "") {
        flushPara(); closeAllLists();
      } else {
        closeAllLists();
        para.push(line.trim());
      }
    }
    flushPara(); closeAllLists(); closeTable();
    if (inCode) html += `<pre><code>${escHtml(codeBuf.join("\n"))}</code></pre>`;
    return html;
  };

  // Syntax-highlights fenced code blocks after they land in the DOM, via the
  // same syntect-backed highlighter the TUI and the file panel's file viewer
  // use (POST /highlight) — one highlighter, one theme, everywhere maki
  // colors code, instead of a second client-side highlighter with its own
  // look. Cached by "lang\0code" so the typewriter's per-frame re-render of
  // a finished message (see pushTypewriter) reuses the first fetch instead
  // of asking again on every frame; in-flight requests are deduped the same
  // way. A late reply patches every currently-unhighlighted block that still
  // matches, not just the one that triggered the fetch — the node that asked
  // may already have been replaced by a later re-render by the time it lands.
  //
  // A failure (empty fence, code past the server's own limit, a wedged event
  // loop, ...) is cached too, as `null` — every unhighlighted block gets
  // reattempted on essentially every typewriter frame until it is marked
  // `data-hl`, so leaving a failing key retryable turns one bad block into a
  // retry storm for the rest of that message's reveal. `HIGHLIGHT_CODE_LIMIT`
  // mirrors dispatch.rs so an oversized block is never even sent.
  const HIGHLIGHT_CODE_LIMIT = 200_000;
  const highlightCache = new Map();
  const highlightPending = new Set();
  const highlightCodeBlocks = (root) => {
    for (const code of root.querySelectorAll("pre > code[data-lang]:not([data-hl])")) {
      const lang = code.dataset.lang;
      const text = code.textContent;
      if (!text) { code.dataset.hl = "1"; continue; }
      const key = `${lang}\0${text}`;
      if (highlightCache.has(key)) {
        const html = highlightCache.get(key);
        if (html !== null) code.innerHTML = html;
        code.dataset.hl = "1";
        continue;
      }
      if (text.length > HIGHLIGHT_CODE_LIMIT) { highlightCache.set(key, null); code.dataset.hl = "1"; continue; }
      if (highlightPending.has(key)) continue;
      highlightPending.add(key);
      postJson("highlight", { lang, code: text }).then((res) => {
        highlightPending.delete(key);
        const html = res && typeof res.html === "string" ? res.html : null;
        highlightCache.set(key, html);
        for (const el of document.querySelectorAll("pre > code[data-lang]:not([data-hl])")) {
          if (el.dataset.lang === lang && el.textContent === text) {
            if (html !== null) el.innerHTML = html;
            el.dataset.hl = "1";
          }
        }
      });
    }
  };

  // The CLI never dumps a whole network chunk onto the screen at once — it
  // reveals it at a steady pace (`typewriter_ms_per_char`, 4ms/char, clamped
  // to 30-1000ms per chunk) so text always looks like it's being typed,
  // however big the underlying delta was. The web page received the exact
  // same envelopes just as fast, but rendered them instantly, which read as
  // "batches" next to the CLI. This mirrors that same reveal algorithm
  // client-side, keyed per message node so several streaming messages (e.g.
  // thinking + assistant text) animate independently.
  const TYPEWRITER_MS_PER_CHAR = 4;
  const TYPEWRITER_MIN_MS = 30;
  const TYPEWRITER_MAX_MS = 1000;
  const typewriterNodes = new Set();
  let typewriterRunning = false;
  const runTypewriter = () => {
    const now = performance.now();
    for (const node of [...typewriterNodes]) {
      if (!node.isConnected) { typewriterNodes.delete(node); continue; }
      const progress = Math.min(1, (now - node._twStart) / node._twDuration);
      const shown = Math.round(node._twFrom + (node._twTo - node._twFrom) * progress);
      if (shown !== node._twVisible) {
        node._twVisible = shown;
        node._twRender(node.dataset.raw.slice(0, shown));
      }
      if (progress >= 1) typewriterNodes.delete(node);
    }
    autoScroll();
    if (typewriterNodes.size) requestAnimationFrame(runTypewriter);
    else typewriterRunning = false;
  };
  // Feeds more text into a node's reveal, extending its animation the same
  // way the CLI's typewriter does: retarget from wherever it currently is
  // toward the new full length, over a duration sized to what's unrevealed.
  const pushTypewriter = (node, renderFn) => {
    node._twRender = renderFn;
    node._twVisible = node._twVisible ?? 0;
    node._twFrom = node._twVisible;
    node._twTo = node.dataset.raw.length;
    const unrevealed = node._twTo - node._twFrom;
    node._twDuration = Math.min(TYPEWRITER_MAX_MS, Math.max(TYPEWRITER_MIN_MS, unrevealed * TYPEWRITER_MS_PER_CHAR));
    node._twStart = performance.now();
    typewriterNodes.add(node);
    if (!typewriterRunning) { typewriterRunning = true; requestAnimationFrame(runTypewriter); }
  };

  // A user message may carry images (vision attachments, rendered as
  // thumbnails) and a "save"-mode upload leaves a plain "Uploaded file at
  // NAME" line in its own text — turned into a link into the file panel
  // instead of dead text, since NAME is already a path relative to cwd.
  const UPLOAD_LINE_RE = /^Uploaded file at (.+)$/gm;
  const renderUserMessage = (event) => {
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    const text = String(event.text || "");
    let last = 0;
    let m;
    UPLOAD_LINE_RE.lastIndex = 0;
    while ((m = UPLOAD_LINE_RE.exec(text))) {
      wrap.appendChild(document.createTextNode(text.slice(last, m.index)));
      const path = m[1];
      const link = document.createElement("a");
      link.href = "#";
      link.className = "upload-link";
      link.textContent = `📎 ${path}`;
      link.onclick = (ev) => { ev.preventDefault(); openFilesPanel(); openFile(path); };
      wrap.appendChild(link);
      last = UPLOAD_LINE_RE.lastIndex;
    }
    wrap.appendChild(document.createTextNode(text.slice(last)));
    for (const src of event.images || []) {
      wrap.appendChild(document.createElement("br"));
      const link = document.createElement("a");
      link.href = src;
      link.target = "_blank";
      link.rel = "noopener";
      const img = document.createElement("img");
      img.className = "upload-thumb";
      img.src = src;
      link.appendChild(img);
      wrap.appendChild(link);
    }
    log.appendChild(wrap);
  };

  const renderEvent = (event) => {
    switch (event.type) {
      case "text_delta": {
        const last = log.lastElementChild;
        const node = (last && last.dataset.kind === "assistant") ? last : (() => {
          const n = el("msg assistant", "");
          n.dataset.kind = "assistant";
          n.dataset.raw = "";
          log.appendChild(n);
          return n;
        })();
        node.dataset.raw = (node.dataset.raw || "") + event.text;
        pushTypewriter(node, (visible) => { node.innerHTML = renderMarkdown(visible); highlightCodeBlocks(node); });
        break;
      }
      case "thinking_delta": {
        const last = log.lastElementChild;
        const node = (last && last.dataset.kind === "thinking") ? last : (() => {
          const n = el("msg thinking", "");
          n.dataset.kind = "thinking";
          n.dataset.raw = "";
          log.appendChild(n);
          return n;
        })();
        node.dataset.raw = (node.dataset.raw || "") + event.text;
        // Same rendering as text_delta above — the CLI runs thinking
        // through the same markdown-aware renderer as the final answer,
        // just under its own muted/italic color (see the .msg.thinking
        // CSS), not as literal, unstyled ** and ` characters.
        pushTypewriter(node, (visible) => { node.innerHTML = renderMarkdown(visible); highlightCodeBlocks(node); });
        break;
      }
      case "tool_start": {
        toolCard(event);
        // The `question` tool opens a native TUI form the web has no way to
        // drive (it isn't a fixed-shape prompt like permissions — it's an
        // arbitrary interactive Lua window), so the run is genuinely stuck
        // here until someone answers at the actual terminal. Surfacing what's
        // being asked, and paging whoever's watching remotely, at least means
        // that's not a silent, unexplained hang.
        if (event.tool === "question") {
          notify("maki — question", questionPreview(event.input) || "needs your input at the terminal");
        }
        break;
      }
      case "tool_output": {
        const details = toolById(event.id);
        if (details) details.querySelector(".out").textContent = event.content;
        break;
      }
      case "tool_done": {
        const details = toolById(event.id);
        if (details) {
          details.classList.remove("running");
          details.classList.add(event.is_error ? "is-error" : "is-ok");
          const out = details.querySelector(".out");
          if (!event.is_error && event.output && event.output.Image) {
            const { source, text } = event.output.Image;
            out.textContent = "";
            const link = document.createElement("a");
            link.href = `data:${source.media_type};base64,${source.data}`;
            link.target = "_blank";
            link.rel = "noopener";
            const img = document.createElement("img");
            img.className = "tool-thumb";
            img.src = link.href;
            img.alt = text || "";
            link.appendChild(img);
            out.appendChild(link);
            out.appendChild(el("tool-thumb-caption", text || ""));
          } else {
            const text = typeof event.output === "string"
              ? event.output
              : (event.output && event.output.Plain && event.output.Plain.text) || JSON.stringify(event.output);
            out.textContent = event.is_error ? `[error] ${text}` : text;
          }
        }
        break;
      }
      // Both end the run outright, so the stop button must go with them —
      // relying only on a separate "status" SSE frame left it stuck showing
      // on a run that had, in fact, already finished (a status frame lost to
      // a phone backgrounding the tab, or a reconnect that missed it).
      case "error": {
        log.appendChild(el("msg error", event.message));
        setStatus("idle");
        notify("maki — stopped", event.message || "the run ended with an error");
        break;
      }
      case "done": {
        log.appendChild(el("msg system", `— done (${event.num_turns ?? "?"} turns)`));
        setStats({ context_size: event.context_size, context_window: event.context_window, cost: event.cost });
        setStatus("idle");
        notify("maki — done", `${titleEl.textContent || "session"} finished (${event.num_turns ?? "?"} turns)`);
        break;
      }
      case "turn_complete": {
        if (event.usage) setStats({ token_usage: event.usage, cost: event.cost });
        break;
      }
      case "permission_request": {
        pendingPermission = event;
        document.getElementById("perm-tool").textContent = event.tool;
        document.getElementById("perm-scopes").textContent = (event.scopes || []).join(", ");
        denyGuidance.value = "";
        denyGuidance.style.display = "none";
        permEl.style.display = "block";
        syncComposerHeight();
        notify("maki — permission needed", event.tool ? `wants to run ${event.tool}` : "needs your input");
        break;
      }
      case "permission_resolved": {
        if (pendingPermission && pendingPermission.id === event.id) {
          pendingPermission = null;
          permEl.style.display = "none";
          syncComposerHeight();
        }
        break;
      }
      case "user_message": renderUserMessage(event); break;
      case "assistant_text": {
        const node = el("msg assistant", "");
        node.dataset.kind = "assistant";
        node.dataset.raw = event.text;
        node.innerHTML = renderMarkdown(event.text);
        highlightCodeBlocks(node);
        log.appendChild(node);
        break;
      }
      // The snapshot's replay of a past turn's thinking block — the
      // history-side counterpart to thinking_delta above. This case was
      // simply missing: a reconnect or fresh page load silently dropped
      // every earlier thinking block, since nothing in this switch matched
      // the server's {"type": "thinking", ...} shape (app/mod.rs's
      // remote_snapshot()) until now.
      case "thinking": {
        const node = el("msg thinking", "");
        node.dataset.kind = "thinking";
        node.dataset.raw = event.text;
        node.innerHTML = renderMarkdown(event.text);
        highlightCodeBlocks(node);
        log.appendChild(node);
        break;
      }
    }
    autoScroll();
  };

  // One pass over the snapshot's message list: the same shapes live events
  // use, so rendering is the same code path.
  const renderSnapshot = (snap) => {
    usageHistory = [];
    log.replaceChildren();
    if (snap.error) {
      const bare = "/" + SHARE_TOKEN + "/";
      const note = el("msg system", "this link points at a tab that is no longer live");
      log.appendChild(note);
      if (location.pathname.replace(/\/$/, "") !== bare.replace(/\/$/, "")) {
        const back = document.createElement("a");
        back.href = bare;
        back.textContent = "open the whole instance instead";
        note.appendChild(document.createElement("br"));
        note.appendChild(back);
      }
      return;
    }
    replaying = true;
    for (const event of snap.messages || []) renderEvent(event);
    // Snapshot tool cards arrive as start+result pairs; close them.
    for (const details of log.querySelectorAll(".tool.running")) {
      details.classList.remove("running");
    }
    if (snap.pending_permission) {
      renderEvent({ type: "permission_request", id: snap.pending_permission.id, tool: "resuming" });
    }
    replaying = false;
    setHeader(snap);
    // A reconnect (phone screen waking up, a hard refresh) needs to see an
    // already-open focused window again — window_open/window_update only
    // fire on the next change, and some windows (the question tool's form)
    // have no redraw loop of their own to ever produce one.
