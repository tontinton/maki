[advisories]
# cortexkit-tree-sitter-scss is a maintained fork of tree-sitter-scss that
# uses `flag_if_supported` instead of `-Wno-unused-parameter`, which cl.exe
# rejects with D8021 on Windows MSVC. The upstream crate has not merged the
# fix; this fork is the only known-good build path for Windows.
# Owner-approved exception: w0wl0lxd.
#
# See: https://github.com/tontinton/maki/pull/671
ignore = [
  { id = "RUSTSEC-0000-0000", reason = "cortexkit-tree-sitter-scss MSVC compatibility fork" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
]

[[licenses.exceptions]]
name = "cortexkit-tree-sitter-scss"
version = "1.0.1"
allow = ["MIT"]
