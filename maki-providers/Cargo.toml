[package]
name = "maki-providers"
version.workspace = true
edition.workspace = true

[features]
# The recorded loopback server in `test_support` and the golden replay harness
# in `providers::replay`, for suites in other crates. The harness points the
# base directories at a throwaway tree, which is what pulls in `tempfile`
# outside `dev-dependencies`.
test-support = ["dep:tempfile"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
maki-storage = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
strum = { workspace = true }
smol = { workspace = true }
flume = { workspace = true }
futures-lite = { workspace = true }
futures = { workspace = true }
isahc = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
sha2 = { workspace = true }
hmac = { workspace = true }
fastrand = { workspace = true }
maki-config = { workspace = true }
inventory = { workspace = true }
jiff = { workspace = true }
getrandom = { workspace = true }
open = { workspace = true }
keyring = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
test-case = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
