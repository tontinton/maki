[package]
name = "maki-providers"
version.workspace = true
edition.workspace = true

[features]
# The recorded loopback server and the provider setup isolation in
# `test_support`, for suites in other crates.
test-support = ["dep:tempfile"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true, features = ["deserialize"] }
indexmap = { workspace = true }
maki-storage = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["socks", "gzip", "deflate", "stream"] }
base64 = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
sha2 = { workspace = true }
hmac = { workspace = true }
fastrand = { workspace = true }
maki-config = { workspace = true }
inventory = { workspace = true }
jiff = { workspace = true }
getrandom = { workspace = true }
open = { workspace = true }
keyring = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
maki-providers = { workspace = true, features = ["test-support"] }
test-case = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
