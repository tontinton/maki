# Curated model table for Copilot. Rates are USD per 1M tokens.
#
# Fallback pricing used until `/models` reports `billing.token_prices` (or for
# offline runs). The API wins via discovered metadata; these mirror GitHub's
# published rates (usage-based billing since June 2026,
# docs.github.com/copilot/reference/copilot-billing/models-and-pricing), at the
# default context tier.
slug = "copilot"

