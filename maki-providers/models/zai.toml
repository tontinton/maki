# Curated model table for Z.AI. Rates are USD per 1M tokens.
#
# Rates come from the pay as you go table on docs.z.ai, not models.dev, which
# carries a launch promo past its expiry and so halves the GLM-5 line. A later
# `glm-5.x` nobody has curated yet still reads models.dev: a promo rate is the
# wrong number, but it beats the zero an unpriced model gets, which renders as
# free. GLM-5.4 has no published per-token API price yet (coding plan only),
# so its row states none: models.dev supplies the rate once pay-as-you-go
# lists it, and until then its price is unknown.
#
# Defaults: glm-5.3 strong, the multimodal glm-5.3-flash medium, the free
# glm-4.7-flash weak. glm-5.4 is coding-plan only for now, so it is that
# plan's login default rather than a slot a pay-as-you-go key would fail on.
#
# The coding plan's models.dev entry (`zai-coding-plan`) is never priced or
# served: the plan already paid for those models, so every rate in it is zero.
# It still lends limits and vision to a model only the plan lists so far.
slug = "zai"

[[model]]
prefixes = ["glm-5-code"]
tier = "strong"
family = "glm"
vision = false
default = false
max_output_tokens = 131072
context_window = 200000
pricing = { input = 1.2, output = 5.0, cache_write = 0.0, cache_read = 0.3 }

