[package]
name = "maki"
version.workspace = true
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>"]
description = "AI coding agent. Native Rust TUI. Immediate startup, 60 FPS, low memory."
license = "MIT"
repository = "https://github.com/tontinton/maki"
homepage = "https://maki.sh"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

[[bin]]
name = "maki"
path = "src/main.rs"

[dependencies]
maki-ui = { workspace = true }
maki-agent = { workspace = true }
maki-acp = { workspace = true }
maki-config = { workspace = true }
maki-providers = { workspace = true }
maki-storage = { workspace = true }
maki-lua = { workspace = true }
maki-otel = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
futures-lite = { workspace = true }
tempfile = { workspace = true }
isahc = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
flume = { workspace = true }
open = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }

[workspace]
members = [
  "maki-acp",
  "maki-agent",
  "maki-anchor",
  "maki-config",
  "maki-docgen",
  "maki-highlight",
  "maki-interpreter",
  "maki-lua",
  "maki-markdown",
  "maki-otel",
  "maki-pack",
  "maki-providers",
  "maki-remote",
  "maki-storage",
  "maki-config-macro",
  "maki-lua-macro",
  "maki-ui",
]
resolver = "3"

[workspace.package]
version = "0.5.0-rc.10"
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>"]
license = "MIT"
repository = "https://github.com/tontinton/maki"
rust-version = "1.88"

[workspace.dependencies]
maki-agent = { path = "maki-agent" }
maki-acp = { path = "maki-acp" }
maki-config = { path = "maki-config" }
maki-interpreter = { path = "maki-interpreter" }
maki-providers = { path = "maki-providers" }
maki-storage = { path = "maki-storage" }
maki-ui = { path = "maki-ui" }
maki-lua = { path = "maki-lua" }
maki-config-macro = { path = "maki-config-macro" }
maki-lua-macro = { path = "maki-lua-macro" }
maki-highlight = { path = "maki-highlight" }
maki-markdown = { path = "maki-markdown" }
maki-otel = { path = "maki-otel" }
maki-pack = { path = "maki-pack" }
maki-remote = { path = "maki-remote" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bs58 = "0.5"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52"] }
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
termini = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
argon2 = "0.5"
subtle = "2"
hmac = { version = "0.12", default-features = false }
base64 = "0.22"
num-bigint = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
url = "2"
getrandom = "0.3"
fastrand = "2"
test-case = "3"
ignore = "0.4"
memchr = "2"
strum = { version = "0.27", features = ["derive"] }
htmd = "0.5"
tempfile = "3"
tiny_http = { version = "0.12" }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "url", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
similar = { version = "2", features = ["inline", "unicode"] }
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
jsonschema = { version = "0.33", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
keyring = "4"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flume = { version = "0.11", default-features = false, features = ["async", "select"] }
fs4 = "1"
pin-project-lite = "0.2"
rustix = { version = "1", default-features = false, features = ["process"] }
humantime = "2"
semver = "1"
toml = "0.8"
toml_edit = "0.22"
smol = "2"
async-process = "2"
async-lock = "3"
arc-swap = "1"
bitflags = "2"
async-io = "2"
event-listener = "5"
futures-lite = "2"
futures = "0.3"
isahc = { version = "1.7", default-features = false, features = ["text-decoding", "static-curl", "static-ssl", "http2"] }
flate2 = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
nucleo = "0.5"
nucleo-matcher = "0.3"
open = "5"
criterion = { version = "0.5", features = ["html_reports"] }
etcetera = "0.11"
dotenvy = "0.15"
tree-sitter = "0.26"
include_dir = "0.7"
mlua = { version = "0.11", features = ["luau", "luau-jit", "async", "send", "serde", "macros"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3.0"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.25"
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-dart = "0.2.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-containerfile = "0.9.2"
tree-sitter-css = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-json = "0.24"
tree-sitter-make = "1.1"
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty-types" }
get-size2 = "=0.10.1"
notify = { version = "9.0.0-rc.2", default-features = false, features = ["flume", "macos_fsevent"] }
serde_yaml = "0.9"
shell-words = "1"
agent-client-protocol-schema = { version = "0.13", features = ["unstable_elicitation"] }

wait-timeout = "0.2"
inventory = "0.3"

[profile.bench]
debug = true

# Dev rebuilds are linker bound, and debug info is most of what the linker
# chews through. Our crates keep theirs so a debugger still works, the 600
# dependencies do not need any.
[profile.dev.package."*"]
debug = false

# `cc` reads DEBUG from here and passes -g when it is on, which covers the C
# and C++ we build from source: OpenSSL, curl, Luau and 30 tree-sitter
# grammars. Those static archives held the bulk of the bytes.
[profile.dev.build-override]
debug = false

# crossterm 0.29.0 has no VT input on Windows, so bracketed paste never decodes and a
# multiline paste submits at the first newline (#336). Pinned to the head of
# crossterm-rs/crossterm#1030, which lives in refs/pull/1030/head on the upstream repo.
# Remove once the PR ships in a crossterm release.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "3ca54292d2b1f1c58e200a06122ddaf5dd6b5c77" }
