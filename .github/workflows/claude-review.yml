name: Claude Review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      EXTRA: ${{ github.event.comment.body }}
      REVIEW_PROMPT: ${{ vars.REVIEW_PROMPT }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
      REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT || 'high' }}
      REVIEW_MAX_PRS_PER_DAY: ${{ vars.REVIEW_MAX_PRS_PER_DAY || 10 }}
      REVIEW_USER: ${{ github.event.comment.user.login || github.event.pull_request.user.login }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.pull_request.author_association }}
      SCRATCH_DIR: /tmp/claude-review
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.REVIEW_APP_ID != ''
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Acknowledge
        run: gh api --silent "repos/$GITHUB_REPOSITORY/$TARGET/reactions" -f content=eyes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET: ${{ github.event.comment.id && format('issues/comments/{0}', github.event.comment.id) || format('issues/{0}', env.PR) }}
      - run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          && sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: gh pr checkout "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Review
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FALLBACK_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REVIEWER: ${{ steps.app-token.outputs.app-slug || 'github-actions' }}
          OUT: /tmp/claude-review.jsonl
        run: |
          if [ -z "$REVIEW_PROMPT" ]; then
            echo "::error::Set the REVIEW_PROMPT repository variable"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ] &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[].user.login' | grep -xF "$REVIEWER[bot]" >/dev/null; then
            echo "Already reviewed, comment /review to review again"
            exit 0
          fi
          if ! [[ "$AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            since=$(date -u -d '24 hours ago' +%FT%TZ)
            opened=$(gh api -X GET search/issues -f q="repo:$GITHUB_REPOSITORY is:pr author:$REVIEW_USER created:>=$since" --jq .total_count)
            requested=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/comments?since=$since&per_page=100" \
              --jq ".[] | select(.user.login == \"$REVIEW_USER\" and .created_at >= \"$since\" and (.body | ascii_downcase | startswith(\"/review\"))) | .id" | wc -l)
            used=$((opened + requested))
            if [ "$used" -gt "$REVIEW_MAX_PRS_PER_DAY" ]; then
              echo "::notice::$REVIEW_USER used $used reviews in 24h ($opened PRs, $requested /review), limit $REVIEW_MAX_PRS_PER_DAY; a maintainer can comment /review to review anyway"
              exit 0
            fi
          fi
          mkdir -p "$SCRATCH_DIR"
          prompt="${REVIEW_PROMPT//\$PR/$PR}"
          prompt="${prompt//\$REPO/$GITHUB_REPOSITORY}"
          prompt="${prompt//\$REVIEWER/$REVIEWER}"
          review() {
            claude -p "$@" \
              --model "$REVIEW_MODEL" \
              --effort "$REVIEW_EFFORT" \
              --settings '{"attribution":{"commit":"","pr":""},"includeCoAuthoredBy":false,"sandbox":{"network":{"allowedDomains":["github.com","api.github.com"]}}}' \
              --setting-sources user \
              --strict-mcp-config \
              --add-dir "$SCRATCH_DIR" \
              --allowedTools "Read(./**),Grep(./**),Glob(./**),Read(/$SCRATCH_DIR/**),Edit(/$SCRATCH_DIR/**),Write(/$SCRATCH_DIR/**),WebSearch,WebFetch,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)" \
              --output-format stream-json --verbose \
              | tee -a "$OUT" \
              | jq -j --unbuffered '
                if .type == "assistant" then .message.content[]
                  | if .type == "text" then .text + "\n"
                    elif .type == "tool_use" then "> \(.name) \(.input | tostring | .[0:300])\n"
                    else empty end
                elif .type == "result" then
                  "\n== \(.subtype) turns=\(.num_turns) cost=$\(.total_cost_usd)\n",
                  (.permission_denials // [] | .[] | "denied: \(.tool_name) \(.tool_input | tostring | .[0:300])\n")
                else empty end'
          }
          review "$prompt
          ${EXTRA#/review}" && exit 0
          [ -n "$FALLBACK_OAUTH_TOKEN" ] || exit 1
          jq -e 'select(.type == "assistant" and .api_error == "usage_limit_reached")' "$OUT" >/dev/null || exit 1
          echo "::notice::The subscription hit its usage limit, resuming the review on the fallback subscription"
          CLAUDE_CODE_OAUTH_TOKEN=$FALLBACK_OAUTH_TOKEN review \
            --resume "$(jq -r 'select(.type == "system" and .subtype == "init") | .session_id' "$OUT")" \
            "A usage limit cut your last turn off. Continue the review from where you stopped."
