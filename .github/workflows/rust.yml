name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Lists what skips CI rather than what runs it, so a new file runs it by default.
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!*.md"
              - "!site/*"
              - "!site/docs/*"
              - "!site/docs/{extra,static,templates}/**"
              - "!scripts/**"
              - "!flake.*"
              - "!.github/workflows/{claude-review,claude-triage,nix,python,release}.yml"
            deps:
              - "Cargo.toml"
              - "maki-*/Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
              - ".github/workflows/rust.yml"

  fmt:
    name: Format (Rust)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  fmt-lua:
    name: Format (Lua)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=JohnnyMorganz/StyLua
      STYLUA_VERSION: v2.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release downloads 504 for long stretches, so only a cache miss hits them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: stylua-cache
        with:
          path: stylua
          key: stylua-${{ runner.os }}-${{ env.STYLUA_VERSION }}
      - name: Install stylua
        if: steps.stylua-cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/retry.sh curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip stylua
          rm stylua.zip
      - run: ./stylua --check plugins/

  check-lua:
    name: Type check (Lua)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Definition files in `lute check` (luau-lang/lute#1234) are not in a release yet.
      # renovate: datasource=github-releases depName=luau-lang/lute versioning=semver
      LUTE_VERSION: v1.0.1-nightly.20261103
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lute-cache
        with:
          path: lute
          key: lute-${{ runner.os }}-${{ env.LUTE_VERSION }}
      - name: Install lute
        if: steps.lute-cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/retry.sh curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o lute.zip \
            "https://github.com/luau-lang/lute/releases/download/${LUTE_VERSION}/lute-linux-x86_64.zip"
          unzip -o lute.zip lute
          rm lute.zip
      # lute looks for `.config.luau` upward from the working directory, not from the checked files.
      - run: cd plugins && ../lute check $(find . -name '*.lua')

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just
      - run: just lint

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just,cargo-nextest
      - run: sudo apt-get -o Acquire::Retries=5 install -y ripgrep
      - run: just test

  machete:
    name: Unused deps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete
      - run: cargo machete

  # Gated on dependency changes so a newly published advisory doesn't fail unrelated PRs.
  deny:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories licenses sources

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just
      - run: just build
      # Lives here, off the Test critical path, to reuse the warm dev target dir.
      - run: just gen-docs-check

  # Lint and build share little beyond build scripts, so they run as separate jobs.
  windows:
    name: ${{ matrix.recipe == 'lint' && 'Lint' || 'Build' }} (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [lint, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.recipe }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just
      - run: just ${{ matrix.recipe }}

  ci-pass:
    name: CI
    if: always()
    needs: [fmt, fmt-lua, check-lua, lint, test, machete, deny, build, windows]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
