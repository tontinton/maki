name: Python

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - ".github/workflows/python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - ".github/workflows/python.yml"

env:
  RUFF_VERSION: 0.16.2
  TY_VERSION: 0.0.70

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/retry.sh pip install "ruff==${RUFF_VERSION}"
      - run: ruff check scripts/

  typecheck:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/retry.sh pip install "ty==${TY_VERSION}"
      - run: ty check scripts/
