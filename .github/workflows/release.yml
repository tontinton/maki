# To release:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  BINARY_NAME: maki
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create draft release
        run: |
          .github/scripts/retry.sh bash -c \
            'gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes'

  build-linux:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Alpine container
        env:
          # renovate: datasource=docker depName=alpine
          ALPINE_VERSION: "3.24"
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_INCREMENTAL=0 \
            "alpine:${ALPINE_VERSION}" sh -c '
              apk add --no-cache gcc g++ musl-dev make linux-headers curl git ca-certificates pkgconf python3-dev
              git config --global --add safe.directory /workspace
              curl --proto "=https" --tlsv1.2 --retry 5 --retry-delay 2 --retry-all-errors -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
              source "$HOME/.cargo/env"
              cargo build --profile release-lto --target ${{ matrix.target }}
            '
          sudo chown -R $(id -u):$(id -g) target/

      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release-lto/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${archive}" "${BINARY_NAME}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  build-bsd:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    # best effort rows (tier 3 on an unpinned nightly, FreeBSD) must not
    # hold back the release of the other targets: a failure ships without
    # those binaries and the installer 404s on that platform
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-netbsd
            zig_target: x86_64-netbsd.10.1
            toolchain: stable
            std: precompiled
            best_effort: false
          - target: aarch64-unknown-netbsd
            zig_target: aarch64-netbsd.10.1
            toolchain: nightly
            std: build-std
            best_effort: true
          # pinned to the oldest supported release so the binaries run on
          # every one, same policy as the .10.1 netbsd baseline
          - target: x86_64-unknown-freebsd
            zig_target: x86_64-freebsd.14.0
            toolchain: stable
            std: precompiled
            best_effort: true
          - target: aarch64-unknown-freebsd
            zig_target: aarch64-freebsd.14.0
            toolchain: stable
            std: precompiled
            best_effort: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zig bundles NetBSD 10.1 and FreeBSD 14 libc headers, crt objects and
      # stub shared libraries, so it is a self-contained cross toolchain for
      # both BSDs: Ubuntu has no gcc-*-bsd packages and neither BSD ships a
      # cross kit for Linux.
      - name: Install zig
        env:
          # renovate: datasource=forgejo-tags depName=ziglang/zig registryUrl=https://codeberg.org
          ZIG_VERSION: 0.17.0
        run: |
          .github/scripts/retry.sh curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME"
          echo "$HOME/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          TARGET: ${{ matrix.target }}
          STD: ${{ matrix.std }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
          if [ "$STD" = precompiled ]; then
            rustup target add "$TARGET"
          else
            # aarch64-unknown-netbsd is tier 3: no precompiled std to download.
            # llvm-tools provides the llvm-ar/llvm-nm that compiler_builtins
            # needs when std is built from source.
            rustup component add rust-src llvm-tools --toolchain "$TOOLCHAIN"
          fi

      - name: Configure cross toolchain
        env:
          TARGET: ${{ matrix.target }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          u=${TARGET//-/_}
          U=${TARGET^^}; U=${U//-/_}
          w="$PWD/.cross"
          mkdir -p "$w"
          for m in cc cxx; do
            [ "$m" = cxx ] && zm='c++' || zm='cc'
            cat > "$w/$m" <<EOF
          #!/bin/bash
          # the cc crate and openssl-src pass the rust triple as -target / --target=,
          # which zig cannot parse; swap it for zig's own target syntax
          args=(); skip=0
          for a in "\$@"; do
            if ((skip)); then skip=0; continue; fi
            case "\$a" in -target|--target) skip=1; continue;; -target=*|--target=*) continue;; esac
            args+=("\$a")
          done
          exec zig $zm -target $ZIG_TARGET "\${args[@]}"
          EOF
          done
          # the FreeBSD precompiled std links libkvm, libmemstat, libprocstat
          # and libdevstat: zig only stubs the core libraries and no binary
          # references these, so empty stubs let the link pass and lld's
          # --as-needed drops the NEEDED entries again
          link_extra=
          case "$TARGET" in
            *-freebsd)
              mkdir -p "$w/stubs"
              : > "$w/stub.c"
              for lib in kvm memstat procstat devstat; do
                zig cc -target "$ZIG_TARGET" -shared -x c -o "$w/stubs/lib$lib.so" "$w/stub.c"
              done
              link_extra="-L$w/stubs"
              ;;
          esac
          cat > "$w/linker" <<EOF
          #!/bin/bash
          exec zig cc -target $ZIG_TARGET $link_extra "\$@"
          EOF
          # wrappers, not "AR=zig ar": openssl-src splits a multi-word AR
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$w/ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > "$w/ranlib"
          chmod +x "$w"/*
          {
            echo "CC_$u=$w/cc"
            echo "CXX_$u=$w/cxx"
            echo "AR_$u=$w/ar"
            echo "RANLIB_$u=$w/ranlib"
            echo "CARGO_TARGET_${U}_LINKER=$w/linker"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ github.ref_name }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          STD: ${{ matrix.std }}
        run: |
          if [ "$STD" = build-std ]; then
            cargo build --profile release-lto --locked --target "$TARGET" -Z build-std=std,panic_abort
          else
            cargo build --profile release-lto --locked --target "$TARGET"
          fi

      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release-lto/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${archive}" "${BINARY_NAME}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  build-other:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ github.ref_name }}

      - name: Build
        run: cargo build --profile release-lto --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release-lto/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${archive}" "${BINARY_NAME}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.zip"
          cp "target/${{ matrix.target }}/release-lto/${BINARY_NAME}.exe" "${BINARY_NAME}.exe"
          7z a "${archive}" "${BINARY_NAME}.exe"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        shell: bash
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  publish:
    name: Publish Release
    needs: [build-linux, build-bsd, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        run: .github/scripts/retry.sh gh release download "$GITHUB_REF_NAME" --dir artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../sha256sums.txt
          cat ../sha256sums.txt

      - name: Upload checksums
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" sha256sums.txt --clobber

      - name: Mark release as published
        run: .github/scripts/retry.sh gh release edit "$GITHUB_REF_NAME" --draft=false
