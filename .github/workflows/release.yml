# To release:
#   bump [workspace.package] version to X.Y.Z-rc.N in Cargo.toml, push to main.
#   The release-bot workflow tags vX.Y.Z-rc.N, which triggers this workflow.
#
# Archives contain both binaries: maki (the agent) and maki-anchor (the
# central server for remote control).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0-rc.1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Tag to release: from a `v*` push ref, or the workflow_dispatch input.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create draft release
        run: |
          .github/scripts/retry.sh bash -c \
            'gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes'

  build-linux:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_INCREMENTAL=0 \
            alpine:3.21 sh -c '
              apk add --no-cache gcc g++ musl-dev make perl linux-headers curl git ca-certificates pkgconf python3-dev
              git config --global --add safe.directory /workspace
              curl --proto "=https" --tlsv1.2 --retry 5 --retry-delay 2 --retry-all-errors -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target ${{ matrix.target }}
              source "$HOME/.cargo/env"
              cargo build --release --target ${{ matrix.target }} --package maki --package maki-anchor
            '
          sudo chown -R $(id -u):$(id -g) target/

      - name: Package
        run: |
          tag="$RELEASE_TAG"
          archive="maki-${tag}-${{ matrix.target }}.tar.gz"
          mkdir stage
          cp "target/${{ matrix.target }}/release/maki" "target/${{ matrix.target }}/release/maki-anchor" stage/
          tar czf "${archive}" -C stage maki maki-anchor
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        run: .github/scripts/retry.sh gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber

  build-other:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ github.ref_name }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package maki --package maki-anchor

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="$RELEASE_TAG"
          archive="maki-${tag}-${{ matrix.target }}.tar.gz"
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/maki" "target/${{ matrix.target }}/release/maki-anchor" stage/
          tar czf "${archive}" -C stage maki maki-anchor
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          archive="maki-${tag}-${{ matrix.target }}.zip"
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/maki.exe" "target/${{ matrix.target }}/release/maki-anchor.exe" stage/
          7z a "${archive}" ./stage/maki.exe ./stage/maki-anchor.exe
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        shell: bash
        run: .github/scripts/retry.sh gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber

  publish:
    name: Publish Release
    needs: [build-linux, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        run: .github/scripts/retry.sh gh release download "$RELEASE_TAG" --dir artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../sha256sums.txt
          cat ../sha256sums.txt

      - name: Upload checksums
        run: .github/scripts/retry.sh gh release upload "$RELEASE_TAG" sha256sums.txt --clobber

      - name: Mark release as published
        run: .github/scripts/retry.sh gh release edit "$RELEASE_TAG" --draft=false
